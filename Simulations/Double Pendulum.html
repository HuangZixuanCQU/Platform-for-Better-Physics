<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Double Pendulum</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 24px;
        }
        .top-bar .logo { font-size: 22px; font-weight: 600; color: #0a1a2b; }
        .top-bar .logo span { color: #2d7aff; }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .top-bar .nav-links a.active { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .lang-btn {
            background: #2d7aff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .lang-btn:hover { background: #1a5fd0; }

        .sim-title { margin-bottom: 16px; }
        .sim-title h1 { font-size: 26px; font-weight: 600; }
        .sim-title h1 span { color: #2d7aff; }
        .sim-title p { color: #4a5a6e; font-size: 15px; }

        #canvas-container {
            display: flex;
            justify-content: center;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #eef3f8;
            padding: 10px;
            margin-bottom: 16px;
            min-height: 400px;
            align-items: center;
        }
        #canvas-container canvas {
            display: block;
            border-radius: 10px;
            background: white;
            width: 100% !important;
            height: auto !important;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            background: #f8faff;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid #eef3f8;
            margin-top: 10px;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            min-width: 24px;
        }
        .control-group input[type="range"] {
            width: 90px;
            cursor: pointer;
            accent-color: #2d7aff;
        }
        .control-group .value {
            font-size: 12px;
            color: #2d7aff;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .btn {
            padding: 5px 14px;
            border: none;
            border-radius: 16px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: #2d7aff; color: white; }
        .btn-primary:hover { background: #1a5fd0; }
        .btn-secondary { background: #e9ecf0; color: #2c3e50; }
        .btn-secondary:hover { background: #d5dae0; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }

        .footer-note {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e6edf4;
            font-size: 14px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; gap: 8px; }
            .btn-group { margin-left: 0; justify-content: center; }
            .control-group input[type="range"] { width: 100%; }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .top-bar .nav-links { gap: 18px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html" data-key="nav_home">Home</a>
                <a href="../share.html" data-key="nav_resources">Resources</a>
                <a href="../simulations.html" class="active" data-key="nav_simulations">Simulations</a>
                <a href="../experiment%20choosing.html" data-key="nav_experiment">AI for Experiment</a>
                <button id="langToggle" class="lang-btn">中文</button>
            </div>
        </div>

        <div class="sim-title">
            <h1 data-key="title">Double <span>Pendulum</span></h1>
            <p data-key="subtitle">p5.js · Chaotic motion with permanent trail · Adjustable initial conditions</p>
        </div>

        <div id="canvas-container"></div>

        <div class="controls">
            <!-- 物理参数 -->
            <div class="control-group">
                <label>L₁</label>
                <input type="range" id="L1Slider" min="80" max="200" value="150" step="1">
                <span class="value" id="L1Value">150</span>
            </div>
            <div class="control-group">
                <label>L₂</label>
                <input type="range" id="L2Slider" min="80" max="200" value="120" step="1">
                <span class="value" id="L2Value">120</span>
            </div>
            <div class="control-group">
                <label>m₁</label>
                <input type="range" id="m1Slider" min="5" max="40" value="20" step="1">
                <span class="value" id="m1Value">20</span>
            </div>
            <div class="control-group">
                <label>m₂</label>
                <input type="range" id="m2Slider" min="5" max="40" value="15" step="1">
                <span class="value" id="m2Value">15</span>
            </div>
            <div class="control-group">
                <label>⏱</label>
                <input type="range" id="speedSlider" min="0.2" max="3.0" value="1.0" step="0.1">
                <span class="value" id="speedValue">1.0x</span>
            </div>

            <!-- 初始条件 -->
            <div class="control-group" style="border-left:2px solid #e6edf4; padding-left:12px;">
                <label>θ₁</label>
                <input type="range" id="theta1InitSlider" min="-180" max="180" value="69" step="1">
                <span class="value" id="theta1InitValue">69°</span>
            </div>
            <div class="control-group">
                <label>θ₂</label>
                <input type="range" id="theta2InitSlider" min="-180" max="180" value="-69" step="1">
                <span class="value" id="theta2InitValue">-69°</span>
            </div>
            <div class="control-group">
                <label>ω₁</label>
                <input type="range" id="omega1InitSlider" min="-5" max="5" value="0" step="0.1">
                <span class="value" id="omega1InitValue">0.0</span>
            </div>
            <div class="control-group">
                <label>ω₂</label>
                <input type="range" id="omega2InitSlider" min="-5" max="5" value="0" step="0.1">
                <span class="value" id="omega2InitValue">0.0</span>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="applyBtn">Apply</button>
                <button class="btn btn-secondary" id="pauseBtn">Pause</button>
                <button class="btn btn-danger" id="clearTrailBtn">Clear Trail</button>
            </div>
        </div>

        <div class="footer-note" data-key="footer">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  LANGUAGE SUPPORT
        // ============================================================
        const translations = {
            zh: {
                nav_home: '首页',
                nav_resources: '资料库',
                nav_simulations: '仿真',
                nav_experiment: 'AI 实验分析',
                title: '双摆',
                subtitle: 'p5.js · 混沌运动，永久轨迹 · 可调初始条件',
                footer: 'PhysicsLab · p5.js · 2026'
            },
            en: {
                nav_home: 'Home',
                nav_resources: 'Resources',
                nav_simulations: 'Simulations',
                nav_experiment: 'AI for Experiment',
                title: 'Double Pendulum',
                subtitle: 'p5.js · Chaotic motion with permanent trail · Adjustable initial conditions',
                footer: 'PhysicsLab · p5.js · 2026'
            }
        };

        let currentLang = 'en';

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) toggleBtn.textContent = lang === 'zh' ? 'English' : '中文';
            localStorage.setItem('preferredLang', lang);
            document.documentElement.lang = lang;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
                });
            }
            const savedLang = localStorage.getItem('preferredLang') || 'en';
            switchLanguage(savedLang);
        });

        // ============================================================
        //  DOUBLE PENDULUM PHYSICS (p5.js)
        // ============================================================

        // ----- 物理参数 -----
        let L1 = 150,
            L2 = 120;
        let m1 = 20,
            m2 = 15;
        let g = 0.4;
        let timeScale = 1.0;

        // ----- 初始条件（只声明，不调用 p5 函数）-----
        let theta1Init, theta2Init;
        let omega1Init = 0;
        let omega2Init = 0;

        // ----- 当前状态 -----
        let theta1, theta2;
        let omega1 = 0,
            omega2 = 0;

        let x1, y1, x2, y2;
        let trail1 = [],
            trail2 = [];
        let paused = false;
        let time = 0;
        let isInitialized = false;

        // ----- DOM refs -----
        const L1Slider = document.getElementById('L1Slider');
        const L2Slider = document.getElementById('L2Slider');
        const m1Slider = document.getElementById('m1Slider');
        const m2Slider = document.getElementById('m2Slider');
        const speedSlider = document.getElementById('speedSlider');
        const theta1InitSlider = document.getElementById('theta1InitSlider');
        const theta2InitSlider = document.getElementById('theta2InitSlider');
        const omega1InitSlider = document.getElementById('omega1InitSlider');
        const omega2InitSlider = document.getElementById('omega2InitSlider');

        const L1Value = document.getElementById('L1Value');
        const L2Value = document.getElementById('L2Value');
        const m1Value = document.getElementById('m1Value');
        const m2Value = document.getElementById('m2Value');
        const speedValue = document.getElementById('speedValue');
        const theta1InitValue = document.getElementById('theta1InitValue');
        const theta2InitValue = document.getElementById('theta2InitValue');
        const omega1InitValue = document.getElementById('omega1InitValue');
        const omega2InitValue = document.getElementById('omega2InitValue');

        const applyBtn = document.getElementById('applyBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const clearTrailBtn = document.getElementById('clearTrailBtn');

        let originX, originY;

        // ============================================================
        //  DERIVATIVES
        // ============================================================

        function computeAccelerations(t1, t2, w1, w2) {
            const delta = t2 - t1;
            const den1 = (m1 + m2) * L1 - m2 * L1 * cos(delta) * cos(delta);
            const a1 = (m2 * L1 * w1 * w1 * sin(delta) * cos(delta) +
                    m2 * L2 * w2 * w2 * sin(delta) +
                    (m1 + m2) * g * sin(t1) * cos(delta) -
                    (m1 + m2) * g * sin(t2)) / den1;

            const den2 = (L2 / L1) * den1;
            const a2 = (-m2 * L2 * w2 * w2 * sin(delta) * cos(delta) +
                    (m1 + m2) * g * sin(t1) * cos(delta) -
                    (m1 + m2) * g * sin(t2) -
                    (m1 + m2) * L1 * w1 * w1 * sin(delta)) / den2;

            return [a1, a2];
        }

        // ============================================================
        //  VELOCITY VERLET INTEGRATION
        // ============================================================

        function velocityVerlet(dt) {
            const [a1, a2] = computeAccelerations(theta1, theta2, omega1, omega2);

            theta1 += omega1 * dt + 0.5 * a1 * dt * dt;
            theta2 += omega2 * dt + 0.5 * a2 * dt * dt;

            const [a1_new, a2_new] = computeAccelerations(theta1, theta2, omega1 + a1 * dt, omega2 + a2 * dt);

            omega1 += 0.5 * (a1 + a1_new) * dt;
            omega2 += 0.5 * (a2 + a2_new) * dt;
        }

        // ============================================================
        //  INITIALIZATION
        // ============================================================

        function applyInitialConditions() {
            theta1Init = radians(parseFloat(theta1InitSlider.value));
            theta2Init = radians(parseFloat(theta2InitSlider.value));
            omega1Init = parseFloat(omega1InitSlider.value);
            omega2Init = parseFloat(omega2InitSlider.value);

            theta1InitValue.textContent = parseFloat(theta1InitSlider.value).toFixed(0) + '°';
            theta2InitValue.textContent = parseFloat(theta2InitSlider.value).toFixed(0) + '°';
            omega1InitValue.textContent = omega1Init.toFixed(1);
            omega2InitValue.textContent = omega2Init.toFixed(1);

            theta1 = theta1Init;
            theta2 = theta2Init;
            omega1 = omega1Init;
            omega2 = omega2Init;
            trail1 = [];
            trail2 = [];
            time = 0;
            paused = false;
            pauseBtn.textContent = 'Pause';

            x1 = originX + L1 * sin(theta1);
            y1 = originY + L1 * cos(theta1);
            x2 = x1 + L2 * sin(theta2);
            y2 = y1 + L2 * cos(theta2);
            trail1.push({ x: x1, y: y1 });
            trail2.push({ x: x2, y: y2 });

            isInitialized = true;
        }

        function resetPendulum() {
            applyInitialConditions();
        }

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            pixelDensity(1);

            const canvas = createCanvas(780, 600);
            canvas.parent('canvas-container');

            console.log('Canvas created:', canvas.width, 'x', canvas.height);

            originX = width / 2;
            originY = 280;

            // --- 物理参数滑块 ---
            L1Slider.addEventListener('input', function() {
                L1 = parseFloat(this.value);
                L1Value.textContent = L1;
            });
            L2Slider.addEventListener('input', function() {
                L2 = parseFloat(this.value);
                L2Value.textContent = L2;
            });
            m1Slider.addEventListener('input', function() {
                m1 = parseFloat(this.value);
                m1Value.textContent = m1;
            });
            m2Slider.addEventListener('input', function() {
                m2 = parseFloat(this.value);
                m2Value.textContent = m2;
            });
            speedSlider.addEventListener('input', function() {
                timeScale = parseFloat(this.value);
                speedValue.textContent = timeScale.toFixed(1) + 'x';
            });

            // --- 初始条件滑块 ---
            theta1InitSlider.addEventListener('input', function() {
                theta1InitValue.textContent = parseFloat(this.value).toFixed(0) + '°';
            });
            theta2InitSlider.addEventListener('input', function() {
                theta2InitValue.textContent = parseFloat(this.value).toFixed(0) + '°';
            });
            omega1InitSlider.addEventListener('input', function() {
                omega1InitValue.textContent = parseFloat(this.value).toFixed(1);
            });
            omega2InitSlider.addEventListener('input', function() {
                omega2InitValue.textContent = parseFloat(this.value).toFixed(1);
            });

            // --- 按钮 ---
            applyBtn.addEventListener('click', resetPendulum);
            pauseBtn.addEventListener('click', function() {
                paused = !paused;
                this.textContent = paused ? 'Resume' : 'Pause';
            });
            clearTrailBtn.addEventListener('click', function() {
                trail1 = [];
                trail2 = [];
            });

            // --- 初始应用 ---
            applyInitialConditions();

            console.log('Setup complete. originX:', originX, 'originY:', originY);
            console.log('Initial theta1:', theta1, 'theta2:', theta2);
        }

        function draw() {
            background('#fafcff');

            if (!paused && isInitialized) {
                const dt = 0.02 * timeScale;
                time += dt;
                velocityVerlet(dt);

                x1 = originX + L1 * sin(theta1);
                y1 = originY + L1 * cos(theta1);
                x2 = x1 + L2 * sin(theta2);
                y2 = y1 + L2 * cos(theta2);

                trail1.push({ x: x1, y: y1 });
                trail2.push({ x: x2, y: y2 });
            }

            drawTrails();

            push();
            stroke(40, 50, 70);
            strokeWeight(2);
            line(originX, originY, x1, y1);
            line(x1, y1, x2, y2);
            pop();

            push();
            fill(40, 50, 70);
            noStroke();
            ellipse(originX, originY, 12, 12);
            stroke(40, 50, 70);
            strokeWeight(1);
            line(originX - 16, originY, originX + 16, originY);
            line(originX, originY - 16, originX, originY + 16);
            pop();

            push();
            noStroke();
            fill(45, 120, 255);
            ellipse(x1, y1, m1 * 1.2, m1 * 1.2);
            fill(255, 107, 53);
            ellipse(x2, y2, m2 * 1.2, m2 * 1.2);
            pop();

            push();
            fill(40, 50, 70);
            noStroke();
            textSize(13);
            textAlign(LEFT, BOTTOM);
            text('m₁', x1 + 14, y1 - 4);
            text('m₂', x2 + 14, y2 - 4);
            textAlign(RIGHT, TOP);
            text('Time: ' + time.toFixed(1) + ' s  |  Speed: ' + timeScale.toFixed(1) + 'x  |  Trail: ' + trail1.length +
                ' pts', width - 16, 16);
            pop();

            push();
            fill(100, 110, 130);
            noStroke();
            textSize(12);
            textAlign(LEFT, TOP);
            text('θ₁₀ = ' + degrees(theta1Init).toFixed(0) + '°  |  θ₂₀ = ' + degrees(theta2Init).toFixed(0) +
                '°  |  ω₁₀ = ' + omega1Init.toFixed(1) + '  |  ω₂₀ = ' + omega2Init.toFixed(1), 16, 16);
            pop();

            push();
            fill(100, 110, 130);
            noStroke();
            textSize(12);
            textAlign(CENTER, BOTTOM);
            text('Permanent trail · Click "Clear Trail" to erase · Adjust initial conditions and click "Apply"', width / 2,
                height - 8);
            pop();
        }

        function drawTrails() {
            push();
            noFill();
            if (trail1.length > 1) {
                for (let i = 1; i < trail1.length; i++) {
                    const alpha = map(i, 0, trail1.length, 20, 120);
                    stroke(45, 120, 255, alpha);
                    strokeWeight(1.2);
                    line(trail1[i - 1].x, trail1[i - 1].y, trail1[i].x, trail1[i].y);
                }
            }
            pop();

            push();
            noFill();
            if (trail2.length > 1) {
                for (let i = 1; i < trail2.length; i++) {
                    const alpha = map(i, 0, trail2.length, 20, 120);
                    stroke(255, 107, 53, alpha);
                    strokeWeight(1.2);
                    line(trail2[i - 1].x, trail2[i - 1].y, trail2[i].x, trail2[i].y);
                }
            }
            pop();
        }

        function windowResized() {
            // 保持固定尺寸
        }
    </script>

</body>
</html>
