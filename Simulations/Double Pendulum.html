<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Double Pendulum</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 24px;
        }
        .top-bar .logo { font-size: 22px; font-weight: 600; color: #0a1a2b; }
        .top-bar .logo span { color: #2d7aff; }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .top-bar .nav-links a.active { color: #1a5fd0; border-bottom-color: #2d7aff; }

        .sim-title { margin-bottom: 16px; }
        .sim-title h1 { font-size: 26px; font-weight: 600; }
        .sim-title h1 span { color: #2d7aff; }
        .sim-title p { color: #4a5a6e; font-size: 15px; }

        #canvas-container {
            display: flex;
            justify-content: center;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #eef3f8;
            padding: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #canvas-container canvas {
            display: block;
            border-radius: 10px;
            background: white;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            background: #f8faff;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid #eef3f8;
            margin-top: 10px;
            align-items: center;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group label { font-size: 14px; font-weight: 500; color: #2c3e50; min-width: 20px; }
        .control-group input[type="range"] {
            width: 140px;
            cursor: pointer;
            accent-color: #2d7aff;
        }
        .control-group .value {
            font-size: 14px;
            color: #2d7aff;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
        }
        .btn-group { display: flex; gap: 10px; margin-left: auto; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: #2d7aff; color: white; }
        .btn-primary:hover { background: #1a5fd0; }
        .btn-secondary { background: #e9ecf0; color: #2c3e50; }
        .btn-secondary:hover { background: #d5dae0; }

        .footer-note {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e6edf4;
            font-size: 14px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { margin-left: 0; justify-content: center; }
            .control-group input[type="range"] { width: 100px; }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .top-bar .nav-links { gap: 18px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../share.html">Resources</a>
                <a href="../simulations.html" class="active">Simulations</a>
            </div>
        </div>

        <div class="sim-title">
            <h1>Double <span>Pendulum</span></h1>
            <p>p5.js · Real-time chaotic motion · Adjustable speed</p>
        </div>

        <div id="canvas-container"></div>

        <div class="controls">
            <div class="control-group">
                <label>L₁</label>
                <input type="range" id="L1Slider" min="80" max="200" value="150" step="1">
                <span class="value" id="L1Value">150</span>
            </div>
            <div class="control-group">
                <label>L₂</label>
                <input type="range" id="L2Slider" min="80" max="200" value="120" step="1">
                <span class="value" id="L2Value">120</span>
            </div>
            <div class="control-group">
                <label>m₁</label>
                <input type="range" id="m1Slider" min="5" max="40" value="20" step="1">
                <span class="value" id="m1Value">20</span>
            </div>
            <div class="control-group">
                <label>m₂</label>
                <input type="range" id="m2Slider" min="5" max="40" value="15" step="1">
                <span class="value" id="m2Value">15</span>
            </div>
            <!-- 新增：时间流速控制 -->
            <div class="control-group">
                <label>⏱</label>
                <input type="range" id="speedSlider" min="0.2" max="3.0" value="1.0" step="0.1">
                <span class="value" id="speedValue">1.0x</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn">Reset</button>
                <button class="btn btn-secondary" id="pauseBtn">Pause</button>
            </div>
        </div>

        <div class="footer-note">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  DOUBLE PENDULUM PHYSICS (p5.js) - 时间流速可调
        // ============================================================

        let L1 = 150,
            L2 = 120;
        let m1 = 20,
            m2 = 15;
        let g = 0.4;
        let timeScale = 1.0; // 新增：时间流速倍率

        let theta1 = 1.2,
            theta2 = -1.2;
        let omega1 = 0,
            omega2 = 0;
        let alpha1 = 0,
            alpha2 = 0;

        let x1, y1, x2, y2;
        let trail1 = [],
            trail2 = [];
        let paused = false;
        let time = 0;

        // DOM refs
        const L1Slider = document.getElementById('L1Slider');
        const L2Slider = document.getElementById('L2Slider');
        const m1Slider = document.getElementById('m1Slider');
        const m2Slider = document.getElementById('m2Slider');
        const speedSlider = document.getElementById('speedSlider'); // 新增
        const L1Value = document.getElementById('L1Value');
        const L2Value = document.getElementById('L2Value');
        const m1Value = document.getElementById('m1Value');
        const m2Value = document.getElementById('m2Value');
        const speedValue = document.getElementById('speedValue'); // 新增
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        let originX, originY;

        // ============================================================
        //  DERIVATIVES
        // ============================================================

        function computeAccelerations(t1, t2, w1, w2) {
            const delta = t2 - t1;
            const den1 = (m1 + m2) * L1 - m2 * L1 * cos(delta) * cos(delta);
            const a1 = (m2 * L1 * w1 * w1 * sin(delta) * cos(delta) +
                    m2 * L2 * w2 * w2 * sin(delta) +
                    (m1 + m2) * g * sin(t1) * cos(delta) -
                    (m1 + m2) * g * sin(t2)) / den1;

            const den2 = (L2 / L1) * den1;
            const a2 = (-m2 * L2 * w2 * w2 * sin(delta) * cos(delta) +
                    (m1 + m2) * g * sin(t1) * cos(delta) -
                    (m1 + m2) * g * sin(t2) -
                    (m1 + m2) * L1 * w1 * w1 * sin(delta)) / den2;

            return [a1, a2];
        }

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            pixelDensity(1);
            const canvas = createCanvas(800, 600);
            canvas.parent('canvas-container');
            originX = width / 2;
            originY = 80;
            resetPendulum();

            L1Slider.addEventListener('input', function() {
                L1 = parseFloat(this.value);
                L1Value.textContent = L1;
                resetPendulum();
            });
            L2Slider.addEventListener('input', function() {
                L2 = parseFloat(this.value);
                L2Value.textContent = L2;
                resetPendulum();
            });
            m1Slider.addEventListener('input', function() {
                m1 = parseFloat(this.value);
                m1Value.textContent = m1;
                resetPendulum();
            });
            m2Slider.addEventListener('input', function() {
                m2 = parseFloat(this.value);
                m2Value.textContent = m2;
                resetPendulum();
            });
            // 新增：时间流速控制
            speedSlider.addEventListener('input', function() {
                timeScale = parseFloat(this.value);
                speedValue.textContent = timeScale.toFixed(1) + 'x';
            });
            resetBtn.addEventListener('click', resetPendulum);
            pauseBtn.addEventListener('click', function() {
                paused = !paused;
                this.textContent = paused ? 'Resume' : 'Pause';
            });
        }

        function resetPendulum() {
            theta1 = 1.2;
            theta2 = -1.2;
            omega1 = 0;
            omega2 = 0;
            trail1 = [];
            trail2 = [];
            time = 0;
        }

        function draw() {
            background('#fafcff');

            // 物理更新 - 应用时间流速
            if (!paused) {
                const dt = 0.04 * timeScale; // 乘以 timeScale
                time += dt;
                const [a1, a2] = computeAccelerations(theta1, theta2, omega1, omega2);
                omega1 += a1 * dt;
                omega2 += a2 * dt;
                theta1 += omega1 * dt;
                theta2 += omega2 * dt;

                // 计算位置
                x1 = originX + L1 * sin(theta1);
                y1 = originY + L1 * cos(theta1);
                x2 = x1 + L2 * sin(theta2);
                y2 = y1 + L2 * cos(theta2);

                trail1.push({ x: x1, y: y1 });
                trail2.push({ x: x2, y: y2 });
                if (trail1.length > 400) trail1.shift();
                if (trail2.length > 400) trail2.shift();
            }

            // 绘制轨迹
            drawTrail();

            // 绘制杆
            push();
            stroke(40, 50, 70);
            strokeWeight(2);
            line(originX, originY, x1, y1);
            line(x1, y1, x2, y2);
            pop();

            // 绘制支点
            push();
            fill(40, 50, 70);
            noStroke();
            ellipse(originX, originY, 12, 12);
            pop();

            // 绘制质量块
            push();
            noStroke();
            fill(45, 120, 255);
            ellipse(x1, y1, m1 * 1.2, m1 * 1.2);
            fill(255, 107, 53);
            ellipse(x2, y2, m2 * 1.2, m2 * 1.2);
            pop();

            // 标签
            push();
            fill(40, 50, 70);
            noStroke();
            textSize(13);
            textAlign(LEFT, BOTTOM);
            text('m₁', x1 + 14, y1 - 4);
            text('m₂', x2 + 14, y2 - 4);
            textAlign(RIGHT, TOP);
            text('Time: ' + time.toFixed(1) + ' s  |  Speed: ' + timeScale.toFixed(1) + 'x', width - 16, 16);
            pop();
        }

        function drawTrail() {
            push();
            noFill();
            stroke(45, 120, 255, 80);
            strokeWeight(1.5);
            beginShape();
            for (const p of trail1) vertex(p.x, p.y);
            endShape();
            stroke(255, 107, 53, 80);
            strokeWeight(1.5);
            beginShape();
            for (const p of trail2) vertex(p.x, p.y);
            endShape();
            pop();
        }

        function windowResized() {}
    </script>

</body>
</html>
