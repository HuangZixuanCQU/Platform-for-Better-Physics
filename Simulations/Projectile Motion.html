<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Projectile Motion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f6f9;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 24px 24px 20px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.07);
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 20px;
        }
        .top-bar .logo {
            font-size: 22px;
            font-weight: 600;
            color: #0a1a2b;
        }
        .top-bar .logo span {
            color: #2d7aff;
        }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }
        .top-bar .nav-links a.active {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }

        .sim-title {
            margin-bottom: 12px;
        }
        .sim-title h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .sim-title h1 span {
            color: #2d7aff;
        }
        .sim-title p {
            color: #4a5a6e;
            font-size: 14px;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .canvas-wrapper {
            flex: 1 1 680px;
            min-width: 0;
        }
        .canvas-wrapper canvas {
            display: block;
            border-radius: 16px;
            background: #fafcff;
            border: 1px solid #eef3f8;
        }

        .controls {
            flex: 0 0 230px;
            min-width: 190px;
            background: #f8faff;
            border-radius: 18px;
            padding: 18px 16px 16px 16px;
            border: 1px solid #eef3f8;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ctrl-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #334155;
            display: flex;
            justify-content: space-between;
        }
        .ctrl-group input[type="range"] {
            width: 100%;
            accent-color: #2d7aff;
            background: #e2e8f0;
            border-radius: 12px;
            height: 5px;
            cursor: pointer;
        }
        .ctrl-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2d7aff;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .value-badge {
            background: #eef2f6;
            padding: 1px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #0f172a;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #2d7aff;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 0.82rem;
            color: #1e293b;
            cursor: pointer;
        }

        .btn-reset {
            background: #eef2f6;
            border: none;
            border-radius: 40px;
            padding: 10px 0;
            font-weight: 550;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 4px;
            border: 1px solid transparent;
            font-family: inherit;
        }
        .btn-reset:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
            font-size: 0.78rem;
            color: #334155;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 4px;
            border-radius: 3px;
        }
        .legend-dot.circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .hint-text {
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: right;
            margin-top: 2px;
        }

        .footer-note {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #e6edf4;
            font-size: 13px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 780px) {
            .controls {
                flex: 1 1 100%;
            }
            .main-layout {
                gap: 16px;
            }
            .container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Navigation -->
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../share.html">Resources</a>
                <a href="../simulations.html" class="active">Simulations</a>
            </div>
        </div>

        <!-- Title -->
        <div class="sim-title">
            <h1>Projectile <span>Motion</span></h1>
            <p>Real-time simulation · Adjust parameters and watch the trajectory update</p>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">
            <div class="canvas-wrapper">
                <div id="p5canvas"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="ctrl-group">
                    <label>Initial Speed <span class="value-badge" id="speedDisplay">28.0</span></label>
                    <input type="range" id="speedSlider" min="6" max="55" value="28" step="0.5">
                </div>
                <div class="ctrl-group">
                    <label>Launch Angle <span class="value-badge" id="angleDisplay">52°</span></label>
                    <input type="range" id="angleSlider" min="5" max="85" value="52" step="0.5">
                </div>
                <div class="ctrl-group">
                    <label>Launch Height <span class="value-badge" id="heightDisplay">0.0</span></label>
                    <input type="range" id="heightSlider" min="-6" max="24" value="0" step="0.5">
                </div>

                <div class="ctrl-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="showTrajectory" checked>
                        <label for="showTrajectory">Trajectory</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showEnvelope" checked>
                        <label for="showEnvelope">Safety parabola</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showRangeLine" checked>
                        <label for="showRangeLine">Range indicator</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showVelocity" checked>
                        <label for="showVelocity">Velocity vector</label>
                    </div>
                </div>

                <button class="btn-reset" id="resetBtn">⟳ Reset to default</button>

                <div class="legend">
                    <span class="legend-item"><span class="legend-dot" style="background:#2d7aff;"></span> Trajectory</span>
                    <span class="legend-item"><span class="legend-dot" style="background:#dc3545;"></span> Envelope</span>
                    <span class="legend-item"><span class="legend-dot" style="background:#28a745;"></span> Range</span>
                    <span class="legend-item"><span class="legend-dot" style="background:#ff6b35;"></span> Velocity</span>
                </div>
                <div class="hint-text">Drag sliders · real-time update</div>
            </div>
        </div>

        <div class="footer-note">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  PROJECTILE MOTION · p5.js
        //  Real-time simulation with trajectory, envelope, range, velocity
        // ============================================================

        // ----- Parameters -----
        let v0 = 28.0;
        let angleDeg = 52;
        let heightM = 0.0;
        let gravity = 9.8;

        // ----- UI flags -----
        let showTrajectory = true;
        let showEnvelope = true;
        let showRange = true;
        let showVelocity = true;

        // ----- Simulation state -----
        let trailPoints = [];
        let envelopePoints = [];
        let ballPos = null;
        let ballVel = null;

        // ----- Display constants -----
        let scaleFactor = 3.6; // pixels per meter
        let groundY = 410;
        let originX = 110;
        let ballRadius = 10;

        // ----- DOM refs -----
        const speedSlider = document.getElementById('speedSlider');
        const angleSlider = document.getElementById('angleSlider');
        const heightSlider = document.getElementById('heightSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const angleDisplay = document.getElementById('angleDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const resetBtn = document.getElementById('resetBtn');

        const showTrajectoryCheck = document.getElementById('showTrajectory');
        const showEnvelopeCheck = document.getElementById('showEnvelope');
        const showRangeCheck = document.getElementById('showRangeLine');
        const showVelocityCheck = document.getElementById('showVelocity');

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            const canvas = createCanvas(780, 480);
            canvas.parent('p5canvas');
            pixelDensity(1);
            textFont('Segoe UI, system-ui, sans-serif');

            // --- Slider events ---
            speedSlider.addEventListener('input', function() {
                v0 = parseFloat(this.value);
                speedDisplay.textContent = v0.toFixed(1);
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });
            angleSlider.addEventListener('input', function() {
                angleDeg = parseFloat(this.value);
                angleDisplay.textContent = angleDeg.toFixed(0) + '°';
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });
            heightSlider.addEventListener('input', function() {
                heightM = parseFloat(this.value);
                heightDisplay.textContent = heightM.toFixed(1);
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });

            // --- Checkbox events ---
            showTrajectoryCheck.addEventListener('change', function() {
                showTrajectory = this.checked;
            });
            showEnvelopeCheck.addEventListener('change', function() {
                showEnvelope = this.checked;
                if (showEnvelope) computeEnvelope();
            });
            showRangeCheck.addEventListener('change', function() {
                showRange = this.checked;
            });
            showVelocityCheck.addEventListener('change', function() {
                showVelocity = this.checked;
            });

            // --- Reset button ---
            resetBtn.addEventListener('click', function() {
                speedSlider.value = '28';
                angleSlider.value = '52';
                heightSlider.value = '0';
                v0 = 28;
                angleDeg = 52;
                heightM = 0;
                speedDisplay.textContent = '28.0';
                angleDisplay.textContent = '52°';
                heightDisplay.textContent = '0.0';
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });

            // --- Initial computation ---
            computeTrajectory();
            if (showEnvelope) computeEnvelope();
        }

        // ============================================================
        //  DRAW
        // ============================================================

        function draw() {
            background(250, 252, 254);

            // ----- Grid -----
            push();
            stroke(220, 228, 238);
            strokeWeight(0.6);
            for (let x = 0; x <= width; x += 50) {
                line(x, 0, x, groundY);
            }
            for (let y = 0; y <= groundY; y += 40) {
                line(0, y, width, y);
            }
            pop();

            // ----- Ground -----
            push();
            stroke(60, 70, 90);
            strokeWeight(2);
            line(0, groundY, width, groundY);
            pop();

            // ----- Launch point -----
            const launchX = originX;
            const launchY = groundY - heightM * scaleFactor;
            push();
            fill(30, 41, 59);
            noStroke();
            circle(launchX, launchY, 8);
            stroke(30, 41, 59, 80);
            strokeWeight(1.2);
            line(launchX - 14, launchY, launchX + 14, launchY);
            line(launchX, launchY - 14, launchX, launchY + 14);
            pop();

            // ----- Safety parabola (envelope) -----
            if (showEnvelope && envelopePoints.length > 2) {
                push();
                noFill();
                stroke(220, 60, 80, 180);
                strokeWeight(2);
                beginShape();
                for (const p of envelopePoints) {
                    vertex(p.x, p.y);
                }
                endShape();
                // dashed extension
                stroke(220, 60, 80, 80);
                strokeWeight(1.5);
                drawingContext.setLineDash([6, 8]);
                beginShape();
                const startIdx = Math.floor(envelopePoints.length * 0.5);
                for (let i = startIdx; i < envelopePoints.length; i++) {
                    vertex(envelopePoints[i].x, envelopePoints[i].y);
                }
                endShape();
                drawingContext.setLineDash([]);
                pop();
            }

            // ----- Trajectory -----
            if (showTrajectory && trailPoints.length > 1) {
                push();
                noFill();
                stroke(45, 120, 255, 200);
                strokeWeight(2.8);
                beginShape();
                for (const p of trailPoints) {
                    vertex(p.x, p.y);
                }
                endShape();
                // Glow effect
                stroke(45, 120, 255, 40);
                strokeWeight(6);
                beginShape();
                for (const p of trailPoints) {
                    vertex(p.x, p.y);
                }
                endShape();
                pop();

                // Trail dots
                push();
                for (let i = 0; i < trailPoints.length; i += 4) {
                    const alpha = map(i, 0, trailPoints.length, 30, 100);
                    fill(45, 120, 255, alpha);
                    noStroke();
                    circle(trailPoints[i].x, trailPoints[i].y, 3.5);
                }
                pop();
            }

            // ----- Range indicator -----
            if (showRange && trailPoints.length > 1) {
                let groundCross = null;
                for (let i = 0; i < trailPoints.length - 1; i++) {
                    const p1 = trailPoints[i];
                    const p2 = trailPoints[i + 1];
                    if ((p1.y - groundY) * (p2.y - groundY) <= 0 && p1.y >= groundY - 2) {
                        const t = (groundY - p1.y) / (p2.y - p1.y);
                        const xCross = p1.x + t * (p2.x - p1.x);
                        groundCross = createVector(xCross, groundY);
                        break;
                    }
                }
                if (groundCross) {
                    push();
                    // Range bar
                    fill(40, 167, 69, 60);
                    noStroke();
                    rect(launchX, groundY - 3, groundCross.x - launchX, 6);
                    stroke(40, 167, 69, 200);
                    strokeWeight(2);
                    line(launchX, groundY, groundCross.x, groundY);
                    // Arrow tip
                    fill(40, 167, 69);
                    noStroke();
                    circle(groundCross.x, groundY, 6);
                    // Range label
                    const rangeM = (groundCross.x - launchX) / scaleFactor;
                    fill(40, 167, 69, 220);
                    noStroke();
                    textSize(13);
                    textAlign(CENTER, BOTTOM);
                    text('R = ' + rangeM.toFixed(1) + ' m', (launchX + groundCross.x) / 2, groundY - 10);
                    pop();
                }
            }

            // ----- Velocity vector -----
            if (showVelocity && ballPos && ballVel) {
                const vScale = 2.2;
                const endX = ballPos.x + ballVel.x * vScale;
                const endY = ballPos.y + ballVel.y * vScale;
                push();
                stroke(255, 107, 53);
                strokeWeight(2.5);
                line(ballPos.x, ballPos.y, endX, endY);
                // Arrowhead
                const angleArrow = atan2(ballVel.y, ballVel.x);
                const headLen = 10;
                push();
                translate(endX, endY);
                rotate(angleArrow);
                fill(255, 107, 53);
                noStroke();
                triangle(0, 0, -headLen, -headLen * 0.4, -headLen, headLen * 0.4);
                pop();
                // Speed label
                const speedMag = sqrt(ballVel.x * ballVel.x + ballVel.y * ballVel.y) / scaleFactor;
                fill(255, 107, 53);
                noStroke();
                textSize(12);
                textAlign(LEFT, BOTTOM);
                text('v = ' + speedMag.toFixed(1) + ' m/s', endX + 8, endY - 4);
                pop();
            }

            // ----- Ball -----
            if (ballPos) {
                // Shadow
                push();
                noStroke();
                fill(0, 0, 0, 40);
                ellipse(ballPos.x + 3, ballPos.y + 6, ballRadius * 1.5, ballRadius * 0.5);
                pop();
                // Ball
                push();
                const grad = drawingContext.createRadialGradient(
                    ballPos.x - 4, ballPos.y - 6, 3,
                    ballPos.x, ballPos.y, ballRadius + 4
                );
                grad.addColorStop(0, '#60a5fa');
                grad.addColorStop(0.6, '#2563eb');
                grad.addColorStop(1, '#1e40af');
                drawingContext.fillStyle = grad;
                drawingContext.beginPath();
                drawingContext.arc(ballPos.x, ballPos.y, ballRadius, 0, Math.PI * 2);
                drawingContext.fill();
                // Highlight
                fill(255, 255, 255, 120);
                ellipse(ballPos.x - 3, ballPos.y - 5, 6, 4);
                pop();
            }

            // ----- Info text -----
            push();
            fill(30, 41, 59);
            noStroke();
            textSize(13);
            textAlign(LEFT, TOP);
            text('v₀ = ' + v0.toFixed(1) + ' m/s  |  θ = ' + angleDeg.toFixed(0) + '°  |  h = ' + heightM.toFixed(1) + ' m',
                16, 14);
            fill(148, 163, 184);
            textSize(11);
            text('Drag sliders · real-time', 16, 34);
            pop();
        }

        // ============================================================
        //  COMPUTATION
        // ============================================================

        function computeTrajectory() {
            const theta = radians(angleDeg);
            const vx = v0 * cos(theta);
            const vy = -v0 * sin(theta);

            trailPoints = [];
            let x = 0,
                y = heightM;
            const dt = 0.02;
            let t = 0;
            let maxSteps = 3000;

            for (let i = 0; i < maxSteps; i++) {
                const px = originX + x * scaleFactor;
                const py = groundY - y * scaleFactor;
                trailPoints.push(createVector(px, py));

                t += dt;
                x = vx * t;
                y = heightM + vy * t - 0.5 * gravity * t * t;

                if (y < 0) {
                    // Linear interpolation to ground
                    const lastP = trailPoints[trailPoints.length - 1];
                    const prevP = trailPoints[trailPoints.length - 2] || lastP;
                    const frac = (groundY - prevP.y) / (lastP.y - prevP.y);
                    const gx = prevP.x + frac * (lastP.x - prevP.x);
                    trailPoints.push(createVector(gx, groundY));
                    break;
                }
                if (px > width + 50 || px < -50) break;
                if (py < -200 || py > groundY + 200) break;
            }

            if (trailPoints.length > 0) {
                const last = trailPoints[trailPoints.length - 1];
                ballPos = last.copy();
                // Velocity at last point
                const vxPix = vx * scaleFactor;
                const vyPix = (-vy + gravity * t) * scaleFactor;
                ballVel = createVector(vxPix, vyPix);
            }
        }

        function computeEnvelope() {
            envelopePoints = [];
            const v = v0;
            const g = gravity;
            const y0 = heightM;
            const maxRange = (v * v) / g;
            const steps = 100;

            for (let i = 0; i <= steps; i++) {
                const xPhys = (i / steps) * maxRange * 1.25;
                const yPhys = y0 + (v * v) / (2 * g) - (g * xPhys * xPhys) / (2 * v * v);
                if (yPhys < -1) continue;
                const px = originX + xPhys * scaleFactor;
                const py = groundY - yPhys * scaleFactor;
                if (px > width + 20) break;
                envelopePoints.push(createVector(px, py));
            }
            // Negative x side (symmetric)
            const negPoints = [];
            for (let i = 1; i <= 40; i++) {
                const xPhys = -(i / 40) * maxRange * 0.4;
                const yPhys = y0 + (v * v) / (2 * g) - (g * xPhys * xPhys) / (2 * v * v);
                if (yPhys < -1) continue;
                const px = originX + xPhys * scaleFactor;
                const py = groundY - yPhys * scaleFactor;
                if (px < -20) break;
                negPoints.push(createVector(px, py));
            }
            envelopePoints = negPoints.reverse().concat(envelopePoints);
        }

        function windowResized() {
            // Keep canvas fixed size
        }
    </script>

</body>
</html>
