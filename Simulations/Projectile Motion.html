<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Projectile Motion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f6f9;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 28px;
            padding: 24px 24px 20px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.07);
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 20px;
        }
        .top-bar .logo {
            font-size: 22px;
            font-weight: 600;
            color: #0a1a2b;
        }
        .top-bar .logo span {
            color: #2d7aff;
        }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }
        .top-bar .nav-links a.active {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }
        
        .lang-btn {
            background: #2d7aff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .lang-btn:hover {
            background: #1a5fd0;
        }

        .sim-title {
            margin-bottom: 12px;
        }
        .sim-title h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .sim-title h1 span {
            color: #2d7aff;
        }
        .sim-title p {
            color: #4a5a6e;
            font-size: 14px;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .canvas-wrapper {
            flex: 1 1 680px;
            min-width: 0;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #fafcff;
            border: 1px solid #eef3f8;
        }

        .controls {
            flex: 0 0 230px;
            min-width: 190px;
            background: #f8faff;
            border-radius: 18px;
            padding: 18px 16px 16px 16px;
            border: 1px solid #eef3f8;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ctrl-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #334155;
            display: flex;
            justify-content: space-between;
        }
        .ctrl-group input[type="range"] {
            width: 100%;
            accent-color: #2d7aff;
            background: #e2e8f0;
            border-radius: 12px;
            height: 5px;
            cursor: pointer;
        }
        .ctrl-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2d7aff;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .value-badge {
            background: #eef2f6;
            padding: 1px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #0f172a;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #2d7aff;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 0.82rem;
            color: #1e293b;
            cursor: pointer;
        }

        .btn-reset {
            background: #eef2f6;
            border: none;
            border-radius: 40px;
            padding: 10px 0;
            font-weight: 550;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 4px;
            border: 1px solid transparent;
            font-family: inherit;
        }
        .btn-reset:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
            font-size: 0.78rem;
            color: #334155;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 4px;
            border-radius: 3px;
        }

        .hint-text {
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: right;
            margin-top: 2px;
        }

        .footer-note {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #e6edf4;
            font-size: 13px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 780px) {
            .controls {
                flex: 1 1 100%;
            }
            .main-layout {
                gap: 16px;
            }
            .container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Navigation -->
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html" data-key="nav_home">Home</a>
                <a href="../share.html" data-key="nav_resources">Resources</a>
                <a href="../simulations.html" class="active" data-key="nav_simulations">Simulations</a>
                <a href="../experiment%20choosing.html" data-key="nav_experiment">AI for Experiment</a>
                <button id="langToggle" class="lang-btn">中文</button>
            </div>
        </div>

        <!-- Title -->
        <div class="sim-title">
            <h1 data-key="title">Projectile <span>Motion</span></h1>
            <p data-key="subtitle">Real-time simulation · Adjust parameters and watch the trajectory update</p>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">
            <div class="canvas-wrapper">
                <div id="p5canvas"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="ctrl-group">
                    <label data-key="label_speed">Initial Speed <span class="value-badge" id="speedDisplay">28.0</span></label>
                    <input type="range" id="speedSlider" min="6" max="55" value="28" step="0.5">
                </div>
                <div class="ctrl-group">
                    <label data-key="label_angle">Launch Angle <span class="value-badge" id="angleDisplay">52°</span></label>
                    <input type="range" id="angleSlider" min="5" max="85" value="52" step="0.5">
                </div>
                <div class="ctrl-group">
                    <label data-key="label_height">Launch Height <span class="value-badge" id="heightDisplay">0.0</span></label>
                    <input type="range" id="heightSlider" min="0" max="40" value="0" step="0.5">
                </div>

                <div class="ctrl-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="showTrajectory" checked>
                        <label for="showTrajectory" data-key="chk_trajectory">Trajectory</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showEnvelope" checked>
                        <label for="showEnvelope" data-key="chk_envelope">Safety parabola</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showRangeLine" checked>
                        <label for="showRangeLine" data-key="chk_range">Range indicator</label>
                    </div>
                </div>

                <button class="btn-reset" id="resetBtn" data-key="btn_reset">⟳ Reset to default</button>

                <div class="legend">
                    <span class="legend-item"><span class="legend-dot" style="background:#2d7aff;"></span> <span data-key="leg_trajectory">Trajectory</span></span>
                    <span class="legend-item"><span class="legend-dot" style="background:#dc3545;"></span> <span data-key="leg_envelope">Envelope</span></span>
                    <span class="legend-item"><span class="legend-dot" style="background:#28a745;"></span> <span data-key="leg_range">Range</span></span>
                </div>
                <div class="hint-text" data-key="hint">Drag sliders · real-time update</div>
            </div>
        </div>

        <div class="footer-note" data-key="footer">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  LANGUAGE SUPPORT
        // ============================================================
        const translations = {
            zh: {
                nav_home: '首页',
                nav_resources: '资料库',
                nav_simulations: '仿真',
                nav_experiment: 'AI 实验分析',
                title: '抛体运动',
                subtitle: '实时仿真 · 调整参数并观察轨迹变化',
                label_speed: '初速度',
                label_angle: '发射角度',
                label_height: '发射高度',
                chk_trajectory: '轨迹',
                chk_envelope: '安全抛物线',
                chk_range: '射程指示',
                btn_reset: '⟳ 重置为默认',
                leg_trajectory: '轨迹',
                leg_envelope: '包络线',
                leg_range: '射程',
                hint: '拖动滑块 · 实时更新',
                footer: 'PhysicsLab · p5.js · 2026'
            },
            en: {
                nav_home: 'Home',
                nav_resources: 'Resources',
                nav_simulations: 'Simulations',
                nav_experiment: 'AI for Experiment',
                title: 'Projectile Motion',
                subtitle: 'Real-time simulation · Adjust parameters and watch the trajectory update',
                label_speed: 'Initial Speed',
                label_angle: 'Launch Angle',
                label_height: 'Launch Height',
                chk_trajectory: 'Trajectory',
                chk_envelope: 'Safety parabola',
                chk_range: 'Range indicator',
                btn_reset: '⟳ Reset to default',
                leg_trajectory: 'Trajectory',
                leg_envelope: 'Envelope',
                leg_range: 'Range',
                hint: 'Drag sliders · real-time update',
                footer: 'PhysicsLab · p5.js · 2026'
            }
        };

        let currentLang = 'en';

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) toggleBtn.textContent = lang === 'zh' ? 'English' : '中文';
            localStorage.setItem('preferredLang', lang);
            document.documentElement.lang = lang;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
                });
            }
            const savedLang = localStorage.getItem('preferredLang') || 'en';
            switchLanguage(savedLang);
        });

        // ============================================================
        //  PROJECTILE MOTION · p5.js
        // ============================================================

        // ----- Parameters -----
        let v0 = 28.0;
        let angleDeg = 52;
        let heightM = 0.0;
        let gravity = 9.8;

        // ----- UI flags -----
        let showTrajectory = true;
        let showEnvelope = true;
        let showRange = true;

        // ----- Simulation state -----
        let trailPoints = [];
        let envelopePoints = [];
        let ballPos = null;

        // ----- Display constants -----
        let scaleFactor = 3.8;
        let groundY = 410;
        let originX = 110;
        let ballRadius = 10;
        let canvasW = 780;
        let canvasH = 480;

        // ----- DOM refs -----
        const speedSlider = document.getElementById('speedSlider');
        const angleSlider = document.getElementById('angleSlider');
        const heightSlider = document.getElementById('heightSlider');
        const speedDisplay = document.getElementById('speedDisplay');
        const angleDisplay = document.getElementById('angleDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const resetBtn = document.getElementById('resetBtn');

        const showTrajectoryCheck = document.getElementById('showTrajectory');
        const showEnvelopeCheck = document.getElementById('showEnvelope');
        const showRangeCheck = document.getElementById('showRangeLine');

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            const canvas = createCanvas(canvasW, canvasH);
            canvas.parent('p5canvas');
            pixelDensity(1);
            textFont('Segoe UI, system-ui, sans-serif');

            // --- Slider events ---
            speedSlider.addEventListener('input', function() {
                v0 = parseFloat(this.value);
                speedDisplay.textContent = v0.toFixed(1);
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });
            angleSlider.addEventListener('input', function() {
                angleDeg = parseFloat(this.value);
                angleDisplay.textContent = angleDeg.toFixed(0) + '°';
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });
            heightSlider.addEventListener('input', function() {
                heightM = parseFloat(this.value);
                heightDisplay.textContent = heightM.toFixed(1);
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });

            // --- Checkbox events ---
            showTrajectoryCheck.addEventListener('change', function() {
                showTrajectory = this.checked;
            });
            showEnvelopeCheck.addEventListener('change', function() {
                showEnvelope = this.checked;
                if (showEnvelope) computeEnvelope();
            });
            showRangeCheck.addEventListener('change', function() {
                showRange = this.checked;
            });

            // --- Reset button ---
            resetBtn.addEventListener('click', function() {
                speedSlider.value = '28';
                angleSlider.value = '52';
                heightSlider.value = '0';
                v0 = 28;
                angleDeg = 52;
                heightM = 0;
                speedDisplay.textContent = '28.0';
                angleDisplay.textContent = '52°';
                heightDisplay.textContent = '0.0';
                computeTrajectory();
                if (showEnvelope) computeEnvelope();
            });

            // --- Initial computation ---
            computeTrajectory();
            if (showEnvelope) computeEnvelope();
        }

        // ============================================================
        //  DRAW
        // ============================================================

        function draw() {
            background(250, 252, 254);

            // ----- Grid -----
            push();
            stroke(220, 228, 238);
            strokeWeight(0.6);
            for (let x = 0; x <= width; x += 50) {
                line(x, 0, x, groundY);
            }
            for (let y = 0; y <= groundY; y += 40) {
                line(0, y, width, y);
            }
            pop();

            // ----- Ground -----
            push();
            stroke(60, 70, 90);
            strokeWeight(2.2);
            line(0, groundY, width, groundY);
            fill(60, 70, 90);
            noStroke();
            textSize(11);
            textAlign(LEFT, TOP);
            text('Ground', 6, groundY + 6);
            pop();

            // ===== 发射点位置 =====
            const launchX = originX;
            const launchY = groundY - heightM * scaleFactor;

            // ----- Launch point -----
            push();
            fill(30, 41, 59);
            noStroke();
            circle(launchX, launchY, 8);
            stroke(30, 41, 59, 80);
            strokeWeight(1.2);
            line(launchX - 14, launchY, launchX + 14, launchY);
            line(launchX, launchY - 14, launchX, launchY + 14);
            fill(30, 41, 59, 180);
            noStroke();
            textSize(11);
            textAlign(LEFT, BOTTOM);
            text('Launch', launchX + 16, launchY - 2);
            pop();

            // ----- Safety parabola (envelope) -----
            if (showEnvelope && envelopePoints.length > 2) {
                push();
                noFill();
                stroke(220, 60, 80, 180);
                strokeWeight(2);
                beginShape();
                for (const p of envelopePoints) {
                    if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
                        vertex(p.x, p.y);
                    }
                }
                endShape();
                stroke(220, 60, 80, 80);
                strokeWeight(1.5);
                drawingContext.setLineDash([6, 8]);
                beginShape();
                const startIdx = Math.floor(envelopePoints.length * 0.4);
                for (let i = startIdx; i < envelopePoints.length; i++) {
                    const p = envelopePoints[i];
                    if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
                        vertex(p.x, p.y);
                    }
                }
                endShape();
                drawingContext.setLineDash([]);
                pop();
            }

            // ----- Trajectory -----
            if (showTrajectory && trailPoints.length > 1) {
                push();
                noFill();
                stroke(45, 120, 255, 200);
                strokeWeight(2.8);
                beginShape();
                for (const p of trailPoints) {
                    if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
                        vertex(p.x, p.y);
                    }
                }
                endShape();
                // Glow effect
                stroke(45, 120, 255, 40);
                strokeWeight(6);
                beginShape();
                for (const p of trailPoints) {
                    if (p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
                        vertex(p.x, p.y);
                    }
                }
                endShape();
                pop();
            }

            // ----- Range indicator -----
            if (showRange && trailPoints.length > 1) {
                let groundCross = null;
                for (let i = 0; i < trailPoints.length - 1; i++) {
                    const p1 = trailPoints[i];
                    const p2 = trailPoints[i + 1];
                    if ((p1.y - groundY) * (p2.y - groundY) <= 0 && p1.y >= groundY - 2) {
                        const t = (groundY - p1.y) / (p2.y - p1.y);
                        const xCross = p1.x + t * (p2.x - p1.x);
                        if (xCross >= 0 && xCross <= width) {
                            groundCross = createVector(xCross, groundY);
                            break;
                        }
                    }
                }
                if (groundCross) {
                    const rangeM = (groundCross.x - originX) / scaleFactor;
                    push();
                    fill(40, 167, 69, 60);
                    noStroke();
                    rect(originX, groundY - 3, groundCross.x - originX, 6);
                    stroke(40, 167, 69, 200);
                    strokeWeight(2);
                    line(originX, groundY, groundCross.x, groundY);
                    fill(40, 167, 69);
                    noStroke();
                    circle(groundCross.x, groundY, 6);
                    fill(40, 167, 69, 220);
                    noStroke();
                    textSize(13);
                    textAlign(CENTER, BOTTOM);
                    text('R = ' + max(0, rangeM).toFixed(1) + ' m', (originX + groundCross.x) / 2, groundY - 10);
                    pop();
                }
            }

            // ----- Ball -----
            if (ballPos) {
                const bx = constrain(ballPos.x, 0, width);
                const by = constrain(ballPos.y, 0, height);
                // Shadow
                push();
                noStroke();
                fill(0, 0, 0, 40);
                ellipse(bx + 3, by + 6, ballRadius * 1.5, ballRadius * 0.5);
                pop();
                // Ball
                push();
                const grad = drawingContext.createRadialGradient(
                    bx - 4, by - 6, 3,
                    bx, by, ballRadius + 4
                );
                grad.addColorStop(0, '#60a5fa');
                grad.addColorStop(0.6, '#2563eb');
                grad.addColorStop(1, '#1e40af');
                drawingContext.fillStyle = grad;
                drawingContext.beginPath();
                drawingContext.arc(bx, by, ballRadius, 0, Math.PI * 2);
                drawingContext.fill();
                fill(255, 255, 255, 120);
                ellipse(bx - 3, by - 5, 6, 4);
                pop();
            }

            // ----- Info text -----
            push();
            fill(30, 41, 59);
            noStroke();
            textSize(13);
            textAlign(LEFT, TOP);
            const maxH = (heightM + (v0 * v0 * sin(radians(angleDeg)) * sin(radians(angleDeg))) / (2 * gravity));
            text('v₀ = ' + v0.toFixed(1) + ' m/s  |  θ = ' + angleDeg.toFixed(0) + '°  |  h₀ = ' + heightM.toFixed(1) +
                ' m  |  H_max = ' + maxH.toFixed(1) + ' m', 16, 14);
            fill(148, 163, 184);
            textSize(11);
            text('Drag sliders · real-time update', 16, 34);
            pop();
        }

        // ============================================================
        //  COMPUTATION
        // ============================================================

        function computeTrajectory() {
            const theta = radians(angleDeg);
            const vx = v0 * cos(theta);
            const vy = v0 * sin(theta);

            trailPoints = [];
            let xPhys = 0;
            let yPhys = heightM;
            const dt = 0.02;
            let t = 0;
            let maxSteps = 3000;

            for (let i = 0; i < maxSteps; i++) {
                const px = originX + xPhys * scaleFactor;
                const py = groundY - yPhys * scaleFactor;
                trailPoints.push(createVector(px, py));

                t += dt;
                xPhys = vx * t;
                yPhys = heightM + vy * t - 0.5 * gravity * t * t;

                if (yPhys < 0) {
                    const lastP = trailPoints[trailPoints.length - 1];
                    const prevP = trailPoints[trailPoints.length - 2] || lastP;
                    if (lastP.y !== prevP.y) {
                        const frac = (groundY - prevP.y) / (lastP.y - prevP.y);
                        const gx = prevP.x + frac * (lastP.x - prevP.x);
                        trailPoints.push(createVector(gx, groundY));
                    } else {
                        trailPoints.push(createVector(lastP.x, groundY));
                    }
                    ballPos = trailPoints[trailPoints.length - 1].copy();
                    return;
                }

                if (px > width + 50 || px < -50) break;
                if (py < -200 || py > groundY + 200) break;
            }

            if (trailPoints.length > 0) {
                ballPos = trailPoints[trailPoints.length - 1].copy();
            }
        }

        function computeEnvelope() {
            envelopePoints = [];
            const v = v0;
            const g = gravity;
            const y0 = heightM;
            const maxRange = (v * v) / g;
            const steps = 120;

            for (let i = 0; i <= steps; i++) {
                const xPhys = (i / steps) * maxRange * 1.2;
                const yPhys = y0 + (v * v) / (2 * g) - (g * xPhys * xPhys) / (2 * v * v);
                if (yPhys < -0.5) continue;
                const px = originX + xPhys * scaleFactor;
                const py = groundY - yPhys * scaleFactor;
                if (px > width + 20) break;
                envelopePoints.push(createVector(px, py));
            }
            const negPoints = [];
            for (let i = 1; i <= 30; i++) {
                const xPhys = -(i / 30) * maxRange * 0.3;
                const yPhys = y0 + (v * v) / (2 * g) - (g * xPhys * xPhys) / (2 * v * v);
                if (yPhys < -0.5) continue;
                const px = originX + xPhys * scaleFactor;
                const py = groundY - yPhys * scaleFactor;
                if (px < -20) break;
                negPoints.push(createVector(px, py));
            }
            if (negPoints.length > 0) {
                envelopePoints = negPoints.reverse().concat(envelopePoints);
            }
        }
