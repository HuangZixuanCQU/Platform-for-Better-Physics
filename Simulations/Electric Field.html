<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Electric Field</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 24px;
        }
        .top-bar .logo { font-size: 22px; font-weight: 600; color: #0a1a2b; }
        .top-bar .logo span { color: #2d7aff; }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .top-bar .nav-links a.active { color: #1a5fd0; border-bottom-color: #2d7aff; }

        .sim-title { margin-bottom: 16px; }
        .sim-title h1 { font-size: 26px; font-weight: 600; }
        .sim-title h1 span { color: #2d7aff; }
        .sim-title p { color: #4a5a6e; font-size: 15px; }

        #canvas-container {
            display: flex;
            justify-content: center;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #eef3f8;
            padding: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #canvas-container canvas {
            display: block;
            border-radius: 10px;
            background: white;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            background: #f8faff;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid #eef3f8;
            margin-top: 10px;
            align-items: center;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group label { font-size: 14px; font-weight: 500; color: #2c3e50; min-width: 20px; }
        .control-group input[type="range"] {
            width: 140px;
            cursor: pointer;
            accent-color: #2d7aff;
        }
        .control-group .value {
            font-size: 14px;
            color: #2d7aff;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
        }
        .btn-group { display: flex; gap: 10px; margin-left: auto; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: #2d7aff; color: white; }
        .btn-primary:hover { background: #1a5fd0; }
        .btn-secondary { background: #e9ecf0; color: #2c3e50; }
        .btn-secondary:hover { background: #d5dae0; }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 14px;
            padding: 14px 20px;
            background: #f8faff;
            border-radius: 12px;
            border: 1px solid #eef3f8;
        }
        .info-item { text-align: center; }
        .info-item .label { font-size: 12px; color: #6b7f94; text-transform: uppercase; letter-spacing: 0.3px; }
        .info-item .val { font-size: 18px; font-weight: 600; color: #1a2332; font-family: 'Courier New', monospace; }
        .info-item .val .unit { font-size: 13px; font-weight: 400; color: #6b7f94; margin-left: 2px; }

        .footer-note {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e6edf4;
            font-size: 14px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { margin-left: 0; justify-content: center; }
            .control-group input[type="range"] { width: 100px; }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .top-bar .nav-links { gap: 18px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../share.html">Resources</a>
                <a href="../simulations.html" class="active">Simulations</a>
            </div>
        </div>

        <div class="sim-title">
            <h1>Electric <span>Field</span> Visualiser</h1>
            <p>p5.js · Real-time field lines and equipotential surfaces</p>
        </div>

        <div id="canvas-container"></div>

        <div class="controls">
            <div class="control-group">
                <label>Q₁</label>
                <input type="range" id="q1Slider" min="-10" max="10" value="5" step="0.5">
                <span class="value" id="q1Value">+5.0</span>
            </div>
            <div class="control-group">
                <label>Q₂</label>
                <input type="range" id="q2Slider" min="-10" max="10" value="-5" step="0.5">
                <span class="value" id="q2Value">-5.0</span>
            </div>
            <div class="control-group">
                <label>Sep</label>
                <input type="range" id="sepSlider" min="40" max="200" value="100" step="2">
                <span class="value" id="sepValue">100</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn">Reset Dipole</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="label">Configuration</div>
                <div class="val" id="configDisplay">Dipole</div>
            </div>
            <div class="info-item">
                <div class="label">Q₁</div>
                <div class="val" id="q1Display">+5.0</div>
            </div>
            <div class="info-item">
                <div class="label">Q₂</div>
                <div class="val" id="q2Display">-5.0</div>
            </div>
            <div class="info-item">
                <div class="label">Field Lines</div>
                <div class="val" id="linesDisplay">24</div>
            </div>
        </div>

        <div class="footer-note">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  ELECTRIC FIELD VISUALISER (p5.js) - 实时重绘
        // ============================================================

        let q1 = 5,
            q2 = -5;
        let separation = 100;
        let fieldLines = [];
        let needRedraw = true;
        let originX, originY;

        const q1Slider = document.getElementById('q1Slider');
        const q2Slider = document.getElementById('q2Slider');
        const sepSlider = document.getElementById('sepSlider');
        const q1Value = document.getElementById('q1Value');
        const q2Value = document.getElementById('q2Value');
        const sepValue = document.getElementById('sepValue');
        const resetBtn = document.getElementById('resetBtn');
        const configDisplay = document.getElementById('configDisplay');
        const q1Display = document.getElementById('q1Display');
        const q2Display = document.getElementById('q2Display');
        const linesDisplay = document.getElementById('linesDisplay');

        // ============================================================
        //  PHYSICS
        // ============================================================

        function electricField(px, py) {
            let ex = 0,
                ey = 0;
            const charges = [
                [q1, -separation / 2, 0],
                [q2, separation / 2, 0]
            ];
            for (const [q, cx, cy] of charges) {
                const dx = px - cx,
                    dy = py - cy;
                const r2 = dx * dx + dy * dy;
                if (r2 < 10) continue;
                const r = sqrt(r2);
                const e = q / r2;
                ex += e * dx / r;
                ey += e * dy / r;
            }
            return [ex, ey];
        }

        function electricPotential(px, py) {
            let v = 0;
            const charges = [
                [q1, -separation / 2, 0],
                [q2, separation / 2, 0]
            ];
            for (const [q, cx, cy] of charges) {
                const dx = px - cx,
                    dy = py - cy;
                const r = sqrt(dx * dx + dy * dy);
                if (r < 1) return 100 * (q > 0 ? 1 : -1);
                v += q / r;
            }
            return v;
        }

        function traceFieldLine(startX, startY, steps = 350) {
            const pts = [{ x: startX, y: startY }];
            let x = startX,
                y = startY;
            for (let i = 0; i < steps; i++) {
                const [ex, ey] = electricField(x, y);
                const mag = sqrt(ex * ex + ey * ey);
                if (mag < 0.01) break;
                const stepSize = 2.8;
                x += stepSize * ex / mag;
                y += stepSize * ey / mag;
                if (x < -380 || x > 380 || y < -380 || y > 380) break;
                let tooClose = false;
                for (const [q, cx, cy] of [
                        [q1, -separation / 2, 0],
                        [q2, separation / 2, 0]
                    ]) {
                    if (dist(x, y, cx, cy) < 14) tooClose = true;
                }
                if (tooClose) break;
                pts.push({ x, y });
            }
            return pts;
        }

        function computeEquipotentialPoints() {
            const pts = [];
            const step = 5;
            for (let x = -320; x <= 320; x += step) {
                for (let y = -320; y <= 320; y += step) {
                    const v = electricPotential(x, y);
                    if (abs(v) < 6 && abs(v) > 0.15) {
                        pts.push({ x, y, v });
                    }
                }
            }
            return pts;
        }

        function computeFieldLines() {
            fieldLines = [];
            const charges = [
                [q1, -separation / 2, 0],
                [q2, separation / 2, 0]
            ];
            const nLines = 28;
            for (const [q, cx, cy] of charges) {
                if (q > 0) {
                    for (let i = 0; i < nLines; i++) {
                        const angle = (TWO_PI / nLines) * i;
                        const r = 13;
                        const sx = cx + r * cos(angle);
                        const sy = cy + r * sin(angle);
                        const line = traceFieldLine(sx, sy);
                        if (line.length > 8) fieldLines.push(line);
                    }
                }
            }
            linesDisplay.textContent = fieldLines.length;
            needRedraw = false;
        }

        function updateInfo() {
            const config = (q1 > 0 && q2 < 0) ? 'Dipole' :
                (q1 < 0 && q2 > 0) ? 'Dipole (rev)' :
                (q1 > 0 && q2 > 0) ? 'Same sign' :
                (q1 < 0 && q2 < 0) ? 'Same sign' :
                (q1 === 0 || q2 === 0) ? 'Single charge' : 'Custom';
            configDisplay.textContent = config;
            q1Display.textContent = (q1 >= 0 ? '+' : '') + q1.toFixed(1);
            q2Display.textContent = (q2 >= 0 ? '+' : '') + q2.toFixed(1);
        }

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            pixelDensity(1);
            const canvas = createCanvas(800, 700);
            canvas.parent('canvas-container');
            originX = width / 2;
            originY = height / 2;
            computeFieldLines();
            updateInfo();

            // 滑块实时触发重绘
            q1Slider.addEventListener('input', function() {
                q1 = parseFloat(this.value);
                q1Value.textContent = (q1 >= 0 ? '+' : '') + q1.toFixed(1);
                needRedraw = true;
                updateInfo();
            });
            q2Slider.addEventListener('input', function() {
                q2 = parseFloat(this.value);
                q2Value.textContent = (q2 >= 0 ? '+' : '') + q2.toFixed(1);
                needRedraw = true;
                updateInfo();
            });
            sepSlider.addEventListener('input', function() {
                separation = parseFloat(this.value);
                sepValue.textContent = separation;
                needRedraw = true;
                updateInfo();
            });
            resetBtn.addEventListener('click', function() {
                q1Slider.value = '5';
                q2Slider.value = '-5';
                sepSlider.value = '100';
                q1 = 5;
                q2 = -5;
                separation = 100;
                q1Value.textContent = '+5.0';
                q2Value.textContent = '-5.0';
                sepValue.textContent = '100';
                needRedraw = true;
                updateInfo();
            });
        }

        function draw() {
            // 需要重绘时重新计算电场线
            if (needRedraw) {
                computeFieldLines();
            }

            background('#fafcff');

            // 网格
            push();
            stroke(220, 225, 235);
            strokeWeight(0.5);
            for (let x = -350; x <= 350; x += 50) {
                line(originX + x, 0, originX + x, height);
            }
            for (let y = -350; y <= 350; y += 50) {
                line(0, originY + y, width, originY + y);
            }
            pop();

            // 等势面（点阵）
            const eqPts = computeEquipotentialPoints();
            push();
            noFill();
            stroke(220, 60, 80, 80);
            strokeWeight(1.0);
            for (const pt of eqPts) {
                if (abs(pt.v) < 0.7) {
                    ellipse(originX + pt.x, originY + pt.y, 2.5, 2.5);
                }
            }
            pop();

            // 电场线
            push();
            noFill();
            for (const line of fieldLines) {
                stroke(45, 120, 255, 180);
                strokeWeight(1.3);
                beginShape();
                for (const pt of line) {
                    vertex(originX + pt.x, originY + pt.y);
                }
                endShape();
            }
            pop();

            // 电荷
            const charges = [
                [q1, -separation / 2, 0],
                [q2, separation / 2, 0]
            ];
            for (const [q, cx, cy] of charges) {
                const px = originX + cx,
                    py = originY + cy;
                const size = 18 + abs(q) * 1.8;
                push();
                noStroke();
                if (q > 0) {
                    fill(255, 193, 7);
                } else if (q < 0) {
                    fill(40, 167, 69);
                } else {
                    fill(200, 200, 200);
                }
                ellipse(px, py, size, size);
                fill(40, 50, 70);
                textSize(15);
                textAlign(CENTER, CENTER);
                text(q > 0 ? '+' : q < 0 ? '−' : '0', px, py + 1);
                pop();
            }

            // 标签
            push();
            fill(40, 50, 70);
            noStroke();
            textSize(13);
            textAlign(LEFT, TOP);
            text('Q₁', originX - separation / 2 + 18, originY - 22);
            text('Q₂', originX + separation / 2 + 18, originY - 22);
            pop();
        }

        function windowResized() {}
    </script>

</body>
</html>
