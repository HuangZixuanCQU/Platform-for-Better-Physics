<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Electric Field</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 24px;
        }
        .top-bar .logo { font-size: 22px; font-weight: 600; color: #0a1a2b; }
        .top-bar .logo span { color: #2d7aff; }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .top-bar .nav-links a.active { color: #1a5fd0; border-bottom-color: #2d7aff; }
        .lang-btn {
            background: #2d7aff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .lang-btn:hover { background: #1a5fd0; }

        .sim-title { margin-bottom: 16px; }
        .sim-title h1 { font-size: 26px; font-weight: 600; }
        .sim-title h1 span { color: #2d7aff; }
        .sim-title p { color: #4a5a6e; font-size: 15px; }

        #canvas-container {
            display: flex;
            justify-content: center;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #eef3f8;
            padding: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #canvas-container canvas {
            display: block;
            border-radius: 10px;
            background: white;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            background: #f8faff;
            padding: 18px 24px;
            border-radius: 14px;
            border: 1px solid #eef3f8;
            margin-top: 10px;
            align-items: center;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group label { font-size: 14px; font-weight: 500; color: #2c3e50; min-width: 20px; }
        .control-group input[type="range"] {
            width: 140px;
            cursor: pointer;
            accent-color: #2d7aff;
        }
        .control-group .value {
            font-size: 14px;
            color: #2d7aff;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
        }
        .btn-group { display: flex; gap: 10px; margin-left: auto; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .btn-primary { background: #2d7aff; color: white; }
        .btn-primary:hover { background: #1a5fd0; }
        .btn-secondary { background: #e9ecf0; color: #2c3e50; }
        .btn-secondary:hover { background: #d5dae0; }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 14px;
            padding: 14px 20px;
            background: #f8faff;
            border-radius: 12px;
            border: 1px solid #eef3f8;
        }
        .info-item { text-align: center; }
        .info-item .label { font-size: 12px; color: #6b7f94; text-transform: uppercase; letter-spacing: 0.3px; }
        .info-item .val { font-size: 18px; font-weight: 600; color: #1a2332; font-family: 'Courier New', monospace; }
        .info-item .val .unit { font-size: 13px; font-weight: 400; color: #6b7f94; margin-left: 2px; }

        .footer-note {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e6edf4;
            font-size: 14px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { margin-left: 0; justify-content: center; }
            .control-group input[type="range"] { width: 100px; }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .top-bar .nav-links { gap: 18px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="logo">Physics<span>Lab</span></div>
            <div class="nav-links">
                <a href="../index.html" data-key="nav_home">Home</a>
                <a href="../share.html" data-key="nav_resources">Resources</a>
                <a href="../simulations.html" class="active" data-key="nav_simulations">Simulations</a>
                <a href="../experiment%20choosing.html" data-key="nav_experiment">AI for Experiment</a>
                <button id="langToggle" class="lang-btn">中文</button>
            </div>
        </div>

        <div class="sim-title">
            <h1 data-key="title">Electric <span>Field</span> Visualiser</h1>
            <p data-key="subtitle">p5.js · Real-time field lines and equipotential surfaces</p>
        </div>

        <div id="canvas-container"></div>

        <div class="controls">
            <div class="control-group">
                <label data-key="label_q1">Q₁</label>
                <input type="range" id="q1Slider" min="-10" max="10" value="5" step="0.5">
                <span class="value" id="q1Value">+5.0</span>
            </div>
            <div class="control-group">
                <label data-key="label_q2">Q₂</label>
                <input type="range" id="q2Slider" min="-10" max="10" value="-5" step="0.5">
                <span class="value" id="q2Value">-5.0</span>
            </div>
            <div class="control-group">
                <label data-key="label_sep">Sep</label>
                <input type="range" id="sepSlider" min="40" max="200" value="100" step="2">
                <span class="value" id="sepValue">100</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn" data-key="btn_reset">Reset Dipole</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="label" data-key="info_config">Configuration</div>
                <div class="val" id="configDisplay">Dipole</div>
            </div>
            <div class="info-item">
                <div class="label" data-key="info_q1">Q₁</div>
                <div class="val" id="q1Display">+5.0</div>
            </div>
            <div class="info-item">
                <div class="label" data-key="info_q2">Q₂</div>
                <div class="val" id="q2Display">-5.0</div>
            </div>
            <div class="info-item">
                <div class="label" data-key="info_lines">Field Lines</div>
                <div class="val" id="linesDisplay">24</div>
            </div>
        </div>

        <div class="footer-note" data-key="footer">PhysicsLab · p5.js · 2026</div>
    </div>

    <script>
        // ============================================================
        //  LANGUAGE SUPPORT
        // ============================================================
        const translations = {
            zh: {
                nav_home: '首页',
                nav_resources: '资料库',
                nav_simulations: '仿真',
                nav_experiment: 'AI 实验分析',
                title: '电场可视化',
                subtitle: 'p5.js · 实时电场线和等势面',
                label_q1: '电荷₁',
                label_q2: '电荷₂',
                label_sep: '间距',
                btn_reset: '重置偶极子',
                info_config: '配置',
                info_q1: '电荷₁',
                info_q2: '电荷₂',
                info_lines: '电场线',
                footer: 'PhysicsLab · p5.js · 2026'
            },
            en: {
                nav_home: 'Home',
                nav_resources: 'Resources',
                nav_simulations: 'Simulations',
                nav_experiment: 'AI for Experiment',
                title: 'Electric Field Visualiser',
                subtitle: 'p5.js · Real-time field lines and equipotential surfaces',
                label_q1: 'Q₁',
                label_q2: 'Q₂',
                label_sep: 'Sep',
                btn_reset: 'Reset Dipole',
                info_config: 'Configuration',
                info_q1: 'Q₁',
                info_q2: 'Q₂',
                info_lines: 'Field Lines',
                footer: 'PhysicsLab · p5.js · 2026'
            }
        };

        let currentLang = 'en';

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) toggleBtn.textContent = lang === 'zh' ? 'English' : '中文';
            localStorage.setItem('preferredLang', lang);
            document.documentElement.lang = lang;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
                });
            }
            const savedLang = localStorage.getItem('preferredLang') || 'en';
            switchLanguage(savedLang);
        });

        // ============================================================
        //  ELECTRIC FIELD VISUALISER
        // ============================================================

        let q1 = 5,
            q2 = -5;
        let separation = 100;
        let fieldLines = [];
        let needRedraw = true;
        let originX, originY;

        const q1Slider = document.getElementById('q1Slider');
        const q2Slider = document.getElementById('q2Slider');
        const sepSlider = document.getElementById('sepSlider');
        const q1Value = document.getElementById('q1Value');
        const q2Value = document.getElementById('q2Value');
        const sepValue = document.getElementById('sepValue');
        const resetBtn = document.getElementById('resetBtn');
        const configDisplay = document.getElementById('configDisplay');
        const q1Display = document.getElementById('q1Display');
        const q2Display = document.getElementById('q2Display');
        const linesDisplay = document.getElementById('linesDisplay');

        // 电荷位置
        function getChargePositions() {
            return [
                { q: q1, x: -separation / 2, y: 0 },
                { q: q2, x: separation / 2, y: 0 }
            ];
        }

        // 计算电场
        function electricField(px, py) {
            let ex = 0,
                ey = 0;
            const charges = getChargePositions();
            for (const ch of charges) {
                const dx = px - ch.x,
                    dy = py - ch.y;
                const r2 = dx * dx + dy * dy;
                if (r2 < 1) continue;
                const r = sqrt(r2);
                const e = ch.q / r2;
                ex += e * dx / r;
                ey += e * dy / r;
            }
            return [ex, ey];
        }

        // 计算电势
        function electricPotential(px, py) {
            let v = 0;
            const charges = getChargePositions();
            for (const ch of charges) {
                const dx = px - ch.x,
                    dy = py - ch.y;
                const r = sqrt(dx * dx + dy * dy);
                if (r < 0.5) return ch.q > 0 ? 100 : -100;
                v += ch.q / r;
            }
            return v;
        }

        // ============================================================
        //  电场线追踪 - 核心改进
        // ============================================================

        function traceFieldLine(startX, startY, forward = true, maxSteps = 600) {
            const pts = [{ x: startX, y: startY }];
            let x = startX,
                y = startY;
            const charges = getChargePositions();
        
            for (let i = 0; i < maxSteps; i++) {
                const [ex, ey] = electricField(x, y);
                const mag = sqrt(ex * ex + ey * ey);
        
                // 如果电场太弱，停止追踪
                if (mag < 0.001) break;
        
                // 动态步长
                let step = 2.8;
                for (const ch of charges) {
                    const d = dist(x, y, ch.x, ch.y);
                    if (d < 50) step = min(step, d * 0.06);
                }
                step = max(step, 0.4);
        
                // 追踪方向
                const dir = forward ? 1 : -1;
                x += dir * step * ex / mag;
                y += dir * step * ey / mag;
        
                // 边界检查
                if (x < -390 || x > 390 || y < -390 || y > 390) break;
        
                // 检查是否到达电荷
                let reachedCharge = false;
                for (const ch of charges) {
                    if (dist(x, y, ch.x, ch.y) < 5) {
                        reachedCharge = true;
                        break;
                    }
                }
                if (reachedCharge) break;
        
                pts.push({ x, y });
        
                // 防止无限循环
                if (pts.length > maxSteps) break;
            }
            return pts;
        }
        // ============================================================
        //  生成电场线
        // ============================================================

        function computeFieldLines() {
            fieldLines = [];
            const charges = getChargePositions();
            const nLines = 32;
        
            // 分离正负电荷
            const posCharges = charges.filter(ch => ch.q > 0.1);
            const negCharges = charges.filter(ch => ch.q < -0.1);
        
            // ===== 1. 从正电荷发出电场线 =====
            for (const ch of posCharges) {
                for (let i = 0; i < nLines; i++) {
                    const angle = (TWO_PI / nLines) * i;
                    const r = 16;
                    const sx = ch.x + r * cos(angle);
                    const sy = ch.y + r * sin(angle);
                    const line = traceFieldLine(sx, sy, true, 600);
                    if (line.length > 3) fieldLines.push(line);
                }
            }
        
            // ===== 2. 从负电荷反向发出（从负电荷周围向外追踪）=====
            // 这可以确保负电荷周围也有线
            for (const ch of negCharges) {
                for (let i = 0; i < nLines; i++) {
                    const angle = (TWO_PI / nLines) * i;
                    const r = 16;
                    const sx = ch.x + r * cos(angle);
                    const sy = ch.y + r * sin(angle);
                    // 反向追踪：从负电荷向外
                    const line = traceFieldLine(sx, sy, false, 600);
                    if (line.length > 3) fieldLines.push(line);
                }
            }
        
            // ===== 3. 从边界全覆盖（无论电荷配置如何）=====
            // 从画布边界均匀分布的点出发，正向追踪
            const nBoundary = 48;
            for (let i = 0; i < nBoundary; i++) {
                const angle = (TWO_PI / nBoundary) * i;
                const radius = 370;
                const sx = radius * cos(angle);
                const sy = radius * sin(angle);
                const line = traceFieldLine(sx, sy, true, 800);
                if (line.length > 3) fieldLines.push(line);
            }
        
            // ===== 4. 额外：从边界内部一圈再发一次（增加密度）=====
            const nInner = 24;
            for (let i = 0; i < nInner; i++) {
                const angle = (TWO_PI / nInner) * i + 0.1;
                const radius = 280;
                const sx = radius * cos(angle);
                const sy = radius * sin(angle);
                const line = traceFieldLine(sx, sy, true, 600);
                if (line.length > 3) fieldLines.push(line);
            }
        
            linesDisplay.textContent = fieldLines.length;
            needRedraw = false;
        }
        // ============================================================
        //  等势面点
        // ============================================================

        function computeEquipotentialPoints() {
            const pts = [];
            const step = 6;
            for (let x = -340; x <= 340; x += step) {
                for (let y = -340; y <= 340; y += step) {
                    const v = electricPotential(x, y);
                    if (abs(v) < 5 && abs(v) > 0.1) {
                        pts.push({ x, y, v });
                    }
                }
            }
            return pts;
        }

        // ============================================================
        //  UI 更新
        // ============================================================

        function updateInfo() {
            const charges = getChargePositions();
            const hasPos = charges.some(ch => ch.q > 0.1);
            const hasNeg = charges.some(ch => ch.q < -0.1);

            let config = 'Custom';
            if (hasPos && hasNeg) {
                config = (q1 > 0 && q2 < 0) || (q1 < 0 && q2 > 0) ? 'Dipole' : 'Dipole (mixed)';
            } else if (hasPos && !hasNeg) {
                config = 'Same sign (positive)';
            } else if (!hasPos && hasNeg) {
                config = 'Same sign (negative)';
            } else {
                config = 'No charges';
            }

            configDisplay.textContent = config;
            q1Display.textContent = (q1 >= 0 ? '+' : '') + q1.toFixed(1);
            q2Display.textContent = (q2 >= 0 ? '+' : '') + q2.toFixed(1);
        }

        // ============================================================
        //  p5.js
        // ============================================================

        function setup() {
            pixelDensity(1);
            const canvas = createCanvas(800, 700);
            canvas.parent('canvas-container');
            originX = width / 2;
            originY = height / 2;
            computeFieldLines();
            updateInfo();

            q1Slider.addEventListener('input', function() {
                q1 = parseFloat(this.value);
                q1Value.textContent = (q1 >= 0 ? '+' : '') + q1.toFixed(1);
                needRedraw = true;
                updateInfo();
            });
            q2Slider.addEventListener('input', function() {
                q2 = parseFloat(this.value);
                q2Value.textContent = (q2 >= 0 ? '+' : '') + q2.toFixed(1);
                needRedraw = true;
                updateInfo();
            });
            sepSlider.addEventListener('input', function() {
                separation = parseFloat(this.value);
                sepValue.textContent = separation;
                needRedraw = true;
                updateInfo();
            });
            resetBtn.addEventListener('click', function() {
                q1Slider.value = '5';
                q2Slider.value = '-5';
                sepSlider.value = '100';
                q1 = 5;
                q2 = -5;
                separation = 100;
                q1Value.textContent = '+5.0';
                q2Value.textContent = '-5.0';
                sepValue.textContent = '100';
                needRedraw = true;
                updateInfo();
            });
        }

        function draw() {
            if (needRedraw) {
                computeFieldLines();
            }

            background('#fafcff');

            // 网格
            push();
            stroke(220, 225, 235);
            strokeWeight(0.5);
            for (let x = -350; x <= 350; x += 50) {
                line(originX + x, 0, originX + x, height);
            }
            for (let y = -350; y <= 350; y += 50) {
                line(0, originY + y, width, originY + y);
            }
            pop();

            // 等势面
            const eqPts = computeEquipotentialPoints();
            push();
            noFill();
            stroke(220, 60, 80, 70);
            strokeWeight(1.2);
            for (const pt of eqPts) {
                if (abs(pt.v) < 0.5) {
                    ellipse(originX + pt.x, originY + pt.y, 3, 3);
                }
            }
            pop();

            // 电场线
            push();
            noFill();
            for (const line of fieldLines) {
                if (line.length < 2) continue;
                stroke(45, 120, 255, 160);
                strokeWeight(1.4);
                beginShape();
                for (const pt of line) {
                    vertex(originX + pt.x, originY + pt.y);
                }
                endShape();
            }
            pop();

            // 电荷
            const charges = getChargePositions();
            for (const ch of charges) {
                const px = originX + ch.x,
                    py = originY + ch.y;
                const size = 18 + abs(ch.q) * 1.8;
                push();
                noStroke();
                if (ch.q > 0) {
                    fill(255, 193, 7);
                } else if (ch.q < 0) {
                    fill(40, 167, 69);
                } else {
                    fill(200, 200, 200);
                }
                ellipse(px, py, size, size);
                fill(40, 50, 70);
                textSize(15);
                textAlign(CENTER, CENTER);
                text(ch.q > 0 ? '+' : ch.q < 0 ? '−' : '0', px, py + 1);
                pop();
            }

            // 标签
            push();
            fill(40, 50, 70);
            noStroke();
            textSize(13);
            textAlign(LEFT, TOP);
            const charges2 = getChargePositions();
            if (charges2.length >= 1) {
                text('Q₁', originX + charges2[0].x + 18, originY + charges2[0].y - 22);
            }
            if (charges2.length >= 2) {
                text('Q₂', originX + charges2[1].x + 18, originY + charges2[1].y - 22);
            }
            pop();
        }

        function windowResized() {}
    </script>

</body>
</html>
