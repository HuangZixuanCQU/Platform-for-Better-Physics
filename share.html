<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Learning Repository</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #2d7aff;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            color: #1a2332;
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        .header-sub {
            color: #4a5a6e;
            font-size: 15px;
        }
        .badge {
            font-size: 12px;
            background: #e9ecf0;
            padding: 2px 10px;
            border-radius: 12px;
            color: #4a5a6e;
        }

        /* Toolbar: search + filter */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 16px 0 8px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 2px solid #e9ecf0;
            border-radius: 24px;
            font-size: 14px;
            background: white;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
        }
        .search-box:focus {
            border-color: #2d7aff;
        }
        .search-box::placeholder {
            color: #9aa8b8;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-btn {
            padding: 6px 16px;
            border: 2px solid #e9ecf0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            color: #4a5a6e;
        }
        .filter-btn:hover {
            border-color: #2d7aff;
            color: #1a2332;
        }
        .filter-btn.active {
            background: #2d7aff;
            border-color: #2d7aff;
            color: white;
        }
        .filter-btn .count {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 4px;
        }

        .stats-bar {
            display: flex;
            gap: 24px;
            margin: 8px 0 4px;
            color: #4a5a6e;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .stats-bar span { background: white; padding: 4px 16px; border-radius: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        .category {
            margin-top: 28px;
            background: white;
            border-radius: 16px;
            padding: 20px 24px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: opacity 0.2s;
        }
        .category.hidden {
            display: none;
        }
        .category h2 {
            color: #1a2332;
            font-size: 19px;
            margin: 0 0 14px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecf0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category h2 .count {
            font-size: 13px;
            font-weight: 400;
            color: #6b7a8f;
            margin-left: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }
        .card {
            background: #f8f9fc;
            border-radius: 10px;
            padding: 14px 14px 16px;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #eef0f3;
        }
        .card:hover {
            background: #f0f3ff;
            border-color: #2d7aff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45,122,255,0.12);
        }
        .card.hidden {
            display: none;
        }
        .ext {
            font-size: 28px;
            font-weight: 300;
            color: #2d7aff;
            margin-bottom: 2px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }
        .name {
            font-weight: 500;
            font-size: 13px;
            word-break: break-all;
            color: #1a2332;
            width: 100%;
            line-height: 1.3;
            margin: 4px 0 2px;
        }
        .tag {
            font-size: 10px;
            background: #e9ecf0;
            color: #4a5a6e;
            padding: 1px 12px;
            border-radius: 12px;
            margin: 2px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .download {
            background: #2d7aff;
            color: white;
            padding: 4px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s;
            font-weight: 500;
        }
        .download:hover { background: #1a5fd0; }
        .empty-cat {
            color: #8a9aa8;
            padding: 20px 0;
            text-align: center;
            font-style: italic;
        }
        .loading, .error, .no-results {
            text-align: center;
            padding: 60px 0;
            color: #6b7a8f;
        }
        .error { color: #d1453b; }
        .no-results { display: none; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .grid { grid-template-columns: 1fr 1fr; }
            .category { padding: 16px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>Physics Learning Repository</h1>
        <div class="header-sub">Open educational resources for physics students</div>
    </div>
    <div class="badge">GitHub Pages</div>
</div>

<!-- Toolbar -->
<div class="toolbar">
    <input class="search-box" id="searchInput" type="text" placeholder="Search by filename..." />
    <div class="filter-group" id="filterGroup">
        <!-- Filter buttons will be generated by JavaScript -->
    </div>
</div>

<div class="stats-bar" id="statsBar">
    <span><span id="totalCats">0</span> categories</span>
    <span><span id="totalFiles">0</span> files</span>
    <span><span id="totalSize">0</span></span>
</div>

<div id="container">
    <div class="loading">Loading resources...</div>
</div>

<div class="no-results" id="noResults">No files match your search or filter.</div>

<script>
    // ====== CONFIGURATION ======
    const OWNER = 'HuangZixuanCQU';
    const REPO = 'Platform-for-Better-Physics';
    const FOLDER = 'Terminology';

    const container = document.getElementById('container');
    const searchInput = document.getElementById('searchInput');
    const filterGroup = document.getElementById('filterGroup');
    const noResults = document.getElementById('noResults');

    // Global state
    let allCategoryData = {};      // categoryName -> [file objects]
    let allFileExtensions = new Set();
    let currentFilter = 'All';
    let currentSearch = '';

    function getFileInfo(name) {
        const ext = name.split('.').pop().toLowerCase();
        const map = {
            'pdf': { ext: 'PDF', tag: 'Document' },
            'tex': { ext: 'TeX', tag: 'LaTeX' },
            'md': { ext: 'MD', tag: 'Markdown' },
            'png': { ext: 'PNG', tag: 'Image' },
            'jpg': { ext: 'JPG', tag: 'Image' },
            'jpeg': { ext: 'JPEG', tag: 'Image' },
            'svg': { ext: 'SVG', tag: 'Vector' },
            'gif': { ext: 'GIF', tag: 'Animation' },
            'docx': { ext: 'DOCX', tag: 'Word' },
            'pptx': { ext: 'PPTX', tag: 'Presentation' },
            'xlsx': { ext: 'XLSX', tag: 'Spreadsheet' },
            'zip': { ext: 'ZIP', tag: 'Archive' },
            'csv': { ext: 'CSV', tag: 'Data' },
            'json': { ext: 'JSON', tag: 'Data' },
            'py': { ext: 'PY', tag: 'Python' },
            'ipynb': { ext: 'IPYNB', tag: 'Jupyter' },
            'txt': { ext: 'TXT', tag: 'Text' },
            'c': { ext: 'C', tag: 'C/C++' },
            'cpp': { ext: 'CPP', tag: 'C/C++' },
            'h': { ext: 'H', tag: 'C/C++' },
            'java': { ext: 'JAVA', tag: 'Java' },
            'mat': { ext: 'MAT', tag: 'MATLAB' },
            'm': { ext: 'M', tag: 'MATLAB' },
        };
        return map[ext] || { ext: ext.toUpperCase(), tag: 'File' };
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    async function fetchContents(path) {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to access ${path}`);
        return await res.json();
    }

    // Build filter buttons from all file extensions
    function buildFilterButtons() {
        const sortedExts = Array.from(allFileExtensions).sort();
        let html = `<button class="filter-btn active" data-filter="All">All <span class="count">(${Object.values(allCategoryData).flat().length})</span></button>`;
        for (const ext of sortedExts) {
            const count = Object.values(allCategoryData).flat().filter(f => {
                const e = f.name.split('.').pop().toLowerCase();
                return e === ext;
            }).length;
            html += `<button class="filter-btn" data-filter="${ext}">${ext.toUpperCase()} <span class="count">(${count})</span></button>`;
        }
        filterGroup.innerHTML = html;

        // Add click handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });
    }

    function applyFilters() {
        const searchLower = currentSearch.toLowerCase().trim();
        let hasVisibleCards = false;

        // Loop through all categories
        for (const [catName, files] of Object.entries(allCategoryData)) {
            const categoryEl = document.querySelector(`.category[data-category="${CSS.escape(catName)}"]`);
            if (!categoryEl) continue;

            const cards = categoryEl.querySelectorAll('.card');
            let visibleInCategory = 0;

            cards.forEach(card => {
                const fileName = card.dataset.filename.toLowerCase();
                const fileExt = card.dataset.ext;

                // Search filter
                const matchesSearch = !searchLower || fileName.includes(searchLower);

                // Extension filter
                const matchesExt = currentFilter === 'All' || fileExt === currentFilter;

                const visible = matchesSearch && matchesExt;
                card.classList.toggle('hidden', !visible);
                if (visible) {
                    visibleInCategory++;
                    hasVisibleCards = true;
                }
            });

            // Show/hide entire category
            categoryEl.classList.toggle('hidden', visibleInCategory === 0);

            // Update category file count
            const countSpan = categoryEl.querySelector('.count');
            if (countSpan) {
                const total = files.length;
                countSpan.textContent = visibleInCategory === total 
                    ? `${total} file${total > 1 ? 's' : ''}`
                    : `${visibleInCategory} / ${total} file${total > 1 ? 's' : ''}`;
            }
        }

        // Show/hide "no results" message
        noResults.style.display = hasVisibleCards ? 'none' : 'block';
    }

    async function loadAll() {
        try {
            const items = await fetchContents(FOLDER);

            const folders = items.filter(item => item.type === 'dir');
            const rootFiles = items.filter(item => item.type === 'file');

            const categoryMap = {};

            for (const folder of folders) {
                const files = await fetchContents(`${FOLDER}/${folder.name}`);
                const fileItems = files.filter(f => f.type === 'file');
                if (fileItems.length > 0) {
                    categoryMap[folder.name] = fileItems;
                }
            }

            if (rootFiles.length > 0) {
                categoryMap['Uncategorized'] = rootFiles;
            }

            const keys = Object.keys(categoryMap);
            if (keys.length === 0) {
                container.innerHTML = `<div class="empty-cat">No resources yet. Please upload files to the docs/ folder.</div>`;
                document.getElementById('totalCats').textContent = '0';
                document.getElementById('totalFiles').textContent = '0';
                document.getElementById('totalSize').textContent = '0';
                filterGroup.innerHTML = '';
                return;
            }

            // Store globally for filtering
            allCategoryData = categoryMap;

            // Collect all extensions
            allFileExtensions = new Set();
            for (const cat of keys) {
                for (const f of categoryMap[cat]) {
                    const ext = f.name.split('.').pop().toLowerCase();
                    allFileExtensions.add(ext);
                }
            }

            // Update stats
            let totalFileCount = 0;
            let totalByteSize = 0;
            for (const cat of keys) {
                totalFileCount += categoryMap[cat].length;
                for (const f of categoryMap[cat]) {
                    totalByteSize += f.size;
                }
            }
            document.getElementById('totalCats').textContent = keys.length;
            document.getElementById('totalFiles').textContent = totalFileCount;
            document.getElementById('totalSize').textContent = formatSize(totalByteSize);

            const sortedKeys = keys.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));

            let html = '';
            for (const catName of sortedKeys) {
                const files = categoryMap[catName];
                files.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

                html += `<div class="category" data-category="${catName}">
                    <h2>${catName} <span class="count">${files.length} file${files.length > 1 ? 's' : ''}</span></h2>
                    <div class="grid">`;

                for (const file of files) {
                    const info = getFileInfo(file.name);
                    const ext = file.name.split('.').pop().toLowerCase();
                    html += `
                        <div class="card" data-filename="${file.name.toLowerCase()}" data-ext="${ext}">
                            <div class="ext">${info.ext}</div>
                            <div class="name">${file.name}</div>
                            <div class="tag">${info.tag}</div>
                            <a class="download" href="${file.download_url}" target="_blank">Download</a>
                        </div>
                    `;
                }

                html += `</div></div>`;
            }

            container.innerHTML = html;

            // Build filter buttons
            buildFilterButtons();

            // Set up search listener
            searchInput.addEventListener('input', function() {
                currentSearch = this.value;
                applyFilters();
            });

            // Initial filter state
            currentFilter = 'All';
            currentSearch = '';
            applyFilters();

        } catch (err) {
            container.innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
            console.error(err);
        }
    }

    loadAll();
</script>
</body>
</html>
