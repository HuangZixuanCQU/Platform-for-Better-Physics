<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab · Resources</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
        }

        /* ===== NAVIGATION BAR ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 16px;
            border-bottom: 2px solid #e6edf4;
            margin-bottom: 32px;
        }
        .top-bar .logo {
            font-size: 22px;
            font-weight: 600;
            color: #0a1a2b;
            letter-spacing: -0.3px;
        }
        .top-bar .logo span {
            color: #2d7aff;
        }
        .top-bar .nav-links {
            display: flex;
            gap: 28px;
            font-size: 15px;
        }
        .top-bar .nav-links a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .top-bar .nav-links a:hover {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }
        .top-bar .nav-links a.active {
            color: #1a5fd0;
            border-bottom-color: #2d7aff;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .page-header h1 span {
            color: #2d7aff;
        }
        .page-header p {
            color: #4a5a6e;
            font-size: 16px;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            gap: 24px;
            margin: 8px 0 4px;
            color: #4a5a6e;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .stats-bar span { background: white; padding: 4px 16px; border-radius: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 16px 0 8px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 2px solid #e9ecf0;
            border-radius: 24px;
            font-size: 14px;
            background: white;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
        }
        .search-box:focus { border-color: #2d7aff; }
        .search-box::placeholder { color: #9aa8b8; }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-btn {
            padding: 6px 16px;
            border: 2px solid #e9ecf0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            color: #4a5a6e;
        }
        .filter-btn:hover {
            border-color: #2d7aff;
            color: #1a2332;
        }
        .filter-btn.active {
            background: #2d7aff;
            border-color: #2d7aff;
            color: white;
        }
        .filter-btn .count {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 4px;
        }

        /* ===== FLAT FILE LIST ===== */
        #file-container {
            margin-top: 20px;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }
        .file-card {
            background: white;
            border-radius: 12px;
            padding: 16px 18px 18px;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            border: 1px solid #eef0f3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .file-card:hover {
            background: #f0f3ff;
            border-color: #2d7aff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(45,122,255,0.10);
        }
        .file-card.hidden {
            display: none;
        }
        .file-card .ext {
            font-size: 26px;
            font-weight: 300;
            color: #2d7aff;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .file-card .name {
            font-weight: 500;
            font-size: 14px;
            word-break: break-all;
            color: #1a2332;
            line-height: 1.3;
            margin: 2px 0 2px;
        }
        .file-card .path {
            font-size: 11px;
            color: #8a9aa8;
            font-family: 'Courier New', monospace;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .file-card .path .separator {
            color: #c0c8d4;
            margin: 0 2px;
        }
        .file-card .tag {
            font-size: 10px;
            background: #e9ecf0;
            color: #4a5a6e;
            padding: 1px 12px;
            border-radius: 12px;
            margin: 2px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            align-self: flex-start;
        }
        .file-card .download {
            background: #2d7aff;
            color: white;
            padding: 5px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s;
            font-weight: 500;
            text-align: center;
            margin-top: auto;
        }
        .file-card .download:hover { background: #1a5fd0; }

        .loading, .error, .no-results {
            text-align: center;
            padding: 60px 0;
            color: #6b7a8f;
        }
        .error { color: #d1453b; }
        .no-results { display: none; }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 48px;
            padding-top: 16px;
            border-top: 1px solid #e6edf4;
            font-size: 14px;
            color: #6b7f94;
            text-align: center;
        }

        @media (max-width: 640px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .top-bar .nav-links {
                gap: 18px;
                flex-wrap: wrap;
            }
            .file-grid {
                grid-template-columns: 1fr 1fr;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- ===== NAVIGATION ===== -->
<div class="top-bar">
    <div class="logo">Physics<span>Lab</span></div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="share.html" class="active">Resources</a>
        <a href="simulations.html">Simulations</a>
    </div>
</div>

<!-- ===== HEADER ===== -->
<div class="page-header">
    <h1>Learning <span>Resources</span></h1>
    <p>All files are shown with their full folder path — browse by category using the filters below.</p>
</div>

<!-- ===== STATS ===== -->
<div class="stats-bar" id="statsBar">
    <span><span id="totalCats">0</span> categories</span>
    <span><span id="totalFiles">0</span> files</span>
    <span><span id="totalSize">0</span></span>
</div>

<!-- ===== TOOLBAR ===== -->
<div class="toolbar">
    <input class="search-box" id="searchInput" type="text" placeholder="Search by filename or path..." />
    <div class="filter-group" id="filterGroup"></div>
</div>

<!-- ===== FILE LIST ===== -->
<div id="file-container">
    <div class="loading">Loading resources...</div>
</div>
<div class="no-results" id="noResults">No files match your search or filter.</div>

<!-- ===== FOOTER ===== -->
<div class="footer-note">
    PhysicsLab · GitHub Pages · 2026
</div>

<script>
    // ================================================================
    //  CONFIGURATION
    // ================================================================
    const OWNER = 'HuangZixuanCQU';
    const REPO = 'Platform-for-Better-Physics';
    const FOLDER = 'Resources';

    // ================================================================
    //  STATE
    // ================================================================
    let allFiles = [];
    let allCategories = new Set();
    let currentFilter = 'All';
    let currentSearch = '';

    const container = document.getElementById('file-container');
    const searchInput = document.getElementById('searchInput');
    const filterGroup = document.getElementById('filterGroup');
    const noResults = document.getElementById('noResults');

    // ================================================================
    //  HELPERS
    // ================================================================
    function getFileInfo(name) {
        const ext = name.split('.').pop().toLowerCase();
        const map = {
            'pdf': { ext: 'PDF', tag: 'Document' },
            'tex': { ext: 'TeX', tag: 'LaTeX' },
            'md': { ext: 'MD', tag: 'Markdown' },
            'png': { ext: 'PNG', tag: 'Image' },
            'jpg': { ext: 'JPG', tag: 'Image' },
            'jpeg': { ext: 'JPEG', tag: 'Image' },
            'svg': { ext: 'SVG', tag: 'Vector' },
            'gif': { ext: 'GIF', tag: 'Animation' },
            'docx': { ext: 'DOCX', tag: 'Word' },
            'pptx': { ext: 'PPTX', tag: 'Presentation' },
            'xlsx': { ext: 'XLSX', tag: 'Spreadsheet' },
            'zip': { ext: 'ZIP', tag: 'Archive' },
            'csv': { ext: 'CSV', tag: 'Data' },
            'json': { ext: 'JSON', tag: 'Data' },
            'py': { ext: 'PY', tag: 'Python' },
            'ipynb': { ext: 'IPYNB', tag: 'Jupyter' },
            'txt': { ext: 'TXT', tag: 'Text' },
            'c': { ext: 'C', tag: 'C/C++' },
            'cpp': { ext: 'CPP', tag: 'C/C++' },
            'h': { ext: 'H', tag: 'C/C++' },
            'java': { ext: 'JAVA', tag: 'Java' },
            'mat': { ext: 'MAT', tag: 'MATLAB' },
            'm': { ext: 'M', tag: 'MATLAB' },
        };
        return map[ext] || { ext: ext.toUpperCase(), tag: 'File' };
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getCategoryFromPath(path) {
        const parts = path.split('/');
        if (parts.length > 1 && parts[0] === FOLDER) {
            return parts[1] || 'Uncategorized';
        }
        if (parts.length > 0 && parts[0] !== FOLDER) {
            return parts[0] || 'Uncategorized';
        }
        return 'Uncategorized';
    }

    function getDisplayPath(fullPath) {
        const parts = fullPath.split('/');
        if (parts.length > 0 && parts[0] === FOLDER) {
            return parts.slice(1).join('/');
        }
        return fullPath;
    }

    function getFolderPath(fullPath) {
        const parts = fullPath.split('/');
        let startIndex = 0;
        if (parts.length > 0 && parts[0] === FOLDER) {
            startIndex = 1;
        }
        const folderParts = parts.slice(startIndex, -1);
        return folderParts.join(' / ');
    }

    // ================================================================
    //  FETCH FILES (Recursive)
    // ================================================================

    async function fetchAllFilesRecursive(path, fileList = []) {
        try {
            const items = await fetchContents(path);
            for (const item of items) {
                if (item.type === 'file') {
                    fileList.push({
                        path: item.path,
                        name: item.name,
                        size: item.size,
                        download_url: item.download_url,
                        sha: item.sha,
                    });
                } else if (item.type === 'dir') {
                    await fetchAllFilesRecursive(item.path, fileList);
                }
            }
        } catch (err) {
            console.warn('Error fetching', path, err);
        }
        return fileList;
    }

    async function fetchContents(path) {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to access ${path}`);
        return await res.json();
    }

    // ================================================================
    //  RENDER
    // ================================================================

    function buildFilterButtons() {
        const sortedCats = Array.from(allCategories).sort();
        let html = `<button class="filter-btn active" data-filter="All">All <span class="count">(${allFiles.length})</span></button>`;
        for (const cat of sortedCats) {
            const count = allFiles.filter(f => f.category === cat).length;
            html += `<button class="filter-btn" data-filter="${cat}">${cat} <span class="count">(${count})</span></button>`;
        }
        filterGroup.innerHTML = html;

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });
    }

    function applyFilters() {
        const searchLower = currentSearch.toLowerCase().trim();
        let hasVisible = false;

        const cards = document.querySelectorAll('.file-card');
        cards.forEach(card => {
            const fileName = card.dataset.filename.toLowerCase();
            const filePath = card.dataset.path.toLowerCase();
            const fileCat = card.dataset.category;

            const matchesSearch = !searchLower ||
                fileName.includes(searchLower) ||
                filePath.includes(searchLower);

            const matchesFilter = currentFilter === 'All' || fileCat === currentFilter;

            const visible = matchesSearch && matchesFilter;
            card.classList.toggle('hidden', !visible);
            if (visible) hasVisible = true;
        });

        noResults.style.display = hasVisible ? 'none' : 'block';
    }

    function renderFiles() {
        if (allFiles.length === 0) {
            container.innerHTML = `<div class="empty-cat">No resources found. Please upload files to the docs/ folder.</div>`;
            document.getElementById('totalCats').textContent = '0';
            document.getElementById('totalFiles').textContent = '0';
            document.getElementById('totalSize').textContent = '0';
            filterGroup.innerHTML = '';
            return;
        }

        const totalSize = allFiles.reduce((sum, f) => sum + f.size, 0);
        document.getElementById('totalCats').textContent = allCategories.size;
        document.getElementById('totalFiles').textContent = allFiles.length;
        document.getElementById('totalSize').textContent = formatSize(totalSize);

        allFiles.sort((a, b) => a.path.localeCompare(b.path));

        let html = '<div class="file-grid">';
        for (const file of allFiles) {
            const info = getFileInfo(file.name);
            const folderPath = getFolderPath(file.path);
            const category = file.category;

            const safePath = file.path.replace(/"/g, '&quot;');

            html += `
                <div class="file-card" data-filename="${file.name.toLowerCase()}" data-path="${safePath}" data-category="${category}">
                    <div class="ext">${info.ext}</div>
                    <div class="name">${file.name}</div>
                    <div class="path">${folderPath || 'root'}</div>
                    <div class="tag">${info.tag}</div>
                    <a class="download" href="${file.download_url}" target="_blank">Download</a>
                </div>
            `;
        }
        html += '</div>';

        container.innerHTML = html;

        buildFilterButtons();

        searchInput.addEventListener('input', function() {
            currentSearch = this.value;
            applyFilters();
        });

        currentFilter = 'All';
        currentSearch = '';
        applyFilters();
    }

    // ================================================================
    //  LOAD ALL FILES
    // ================================================================

    async function loadAll() {
        try {
            container.innerHTML = '<div class="loading">Loading resources...</div>';

            const files = await fetchAllFilesRecursive(FOLDER);

            if (files.length === 0) {
                container.innerHTML = `<div class="empty-cat">No resources found. Please upload files to the docs/ folder.</div>`;
                document.getElementById('totalCats').textContent = '0';
                document.getElementById('totalFiles').textContent = '0';
                document.getElementById('totalSize').textContent = '0';
                filterGroup.innerHTML = '';
                return;
            }

            allFiles = files.map(f => {
                const category = getCategoryFromPath(f.path);
                allCategories.add(category);
                return { ...f, category };
            });

            renderFiles();

        } catch (err) {
            container.innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
            console.error(err);
        }
    }

    loadAll();
</script>

</body>
</html>
